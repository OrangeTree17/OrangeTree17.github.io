  :root{
    color-scheme:light dark;
    --paper:#FFFFFF;
    --ink:#12120F;
    --line:#E1DFD6;
    --muted:#6E6C64;
    --theme:#FCE38A;
    --accent:var(--theme);
    --accent-ink:color-mix(in srgb,var(--theme) 58%,#C96A1B 42%);
    --on-theme:#151513;
    --surface:#FFFFFF;
    --line-soft:var(--line-soft);
    --hover:#F6F5F0;
    --press:#E8E6DD;
    --dim:#C4C1B6;
    --ink-hover:#2B2B25;
    --on-ink:#FFFFFF;
    --deep:#7C2417;
    --shc:18,18,15;
    --r:14px;
    --r-sm:9px;
  }

  @media (prefers-color-scheme: dark){
    :root{
      --paper:#111110;
      --surface:#1A1A17;
      --ink:#F3F1E9;
      --line:#3C3B33;
      --line-soft:#272722;
      --hover:#22221D;
      --press:#2B2B25;
      --dim:#57554B;
      --ink-hover:#DFDBCD;
      --on-ink:#151513;
      --deep:#7A2318;
      --muted:#9B998E;
      --accent:color-mix(in srgb,var(--theme) 80%,#FFFFFF 20%);
      --accent-ink:color-mix(in srgb,var(--theme) 55%,#E08A3C 45%);
      --shc:0,0,0;
    }
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"HarmonyOS Sans SC","HarmonyOS Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:18px 20px 8px;
    max-width:1040px;
    width:100%;
    margin:0 auto;
  }

  .logo{
    appearance:none;
    width:52px;
    height:52px;
    flex:none;
    padding:0;
    background:var(--surface);
    border:0;
    border-radius:var(--r);
    overflow:hidden;
    cursor:pointer;
    line-height:0;
  }
  .logo{position:relative;}
  .logo img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;}

  .logo .logo-color{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
    opacity:0;
    pointer-events:none;
    transition:opacity .5s cubic-bezier(.24,.7,.3,1);
  }
  .logo:hover .logo-color{opacity:1;}
  .logo:hover .logo-black{opacity:0;}
  .logo:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

  .hud{
    display:flex;
    align-items:center;
    gap:16px;
    font-size:13px;
    color:var(--muted);
    letter-spacing:.02em;
  }
  .hud .count{white-space:nowrap;}
  .hud .count b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;}

  .snd{
    appearance:none;
    background:transparent;
    border:0;
    border-bottom:1px solid var(--line);
    color:var(--muted);
    font:inherit;
    font-size:13px;
    padding:8px 2px;
    min-height:44px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
  }
  .snd:hover{color:var(--accent-ink);border-color:var(--accent-ink);}
  #gestBtn:hover{background:var(--surface);border-color:var(--accent-ink);color:var(--accent-ink);}
  .snd:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  .snd svg{width:15px;height:15px;display:block;}
  .snd .st{font-variant-numeric:tabular-nums;}
  .snd[data-on="0"] .wave{opacity:.25;}

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:28px;
    padding:16px 20px 56px;
    min-height:0;
  }

  .stage{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    min-height:clamp(180px,32vh,320px);
  }

  .numwrap{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:.04em;
    line-height:.92;
  }
  .numwrap[hidden]{display:none;}

  .num{
    font-size:clamp(112px,31vw,252px);
    font-weight:700;
    letter-spacing:-.045em;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
    min-width:2.1ch;
    text-align:center;
    display:inline-block;
  }
  .num.dim{color:var(--dim);font-weight:600;}

  .unit{
    font-size:clamp(20px,5vw,30px);
    font-weight:400;
    color:var(--muted);
    letter-spacing:.14em;
    padding-bottom:.14em;
    transition:opacity .15s ease;
  }
  .unit.off{opacity:0;}

  .num.fly-out{
    animation:numFlyOut .42s cubic-bezier(.32,.72,.36,1) forwards;
    transform-origin:50% 55%;
    will-change:transform,filter,opacity;
  }
  @keyframes numFlyOut{
    0%{transform:translateY(0) rotate(0) scale(1);filter:blur(0);opacity:1;}
    30%{transform:translateY(-16%) rotate(-7deg) scale(1.03);filter:blur(2px);opacity:.92;}
    100%{transform:translateY(-64%) rotate(-18deg) scale(.8);filter:blur(16px);opacity:0;}
  }

  .num.rise-in{
    animation:numRiseIn .78s cubic-bezier(.24,.7,.3,1) both;
    transform-origin:50% 60%;
    will-change:transform,filter,opacity;
  }
  @keyframes numRiseIn{
    0%{transform:translateY(52%) scale(.84);filter:blur(18px);opacity:0;}
    46%{transform:translateY(-8%) scale(1.05);filter:blur(3px);opacity:1;}
    60%{transform:translateY(1%) scale(.985);filter:blur(0);}
    72%{transform:translateY(-5%) scale(1.018);}
    84%{transform:translateY(0) scale(.995);}
    93%{transform:translateY(-2%) scale(1.006);}
    100%{transform:translateY(0) scale(1);filter:blur(0);opacity:1;}
  }

  .tipwrap{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    padding:0 4px;
    text-align:center;
  }
  .tipwrap[hidden]{display:none;}

  .tip{
    display:inline-block;
    max-width:min(30em,86vw);
    font-size:clamp(13px,1.7vw,16px);
    line-height:1.75;
    font-weight:400;
    letter-spacing:.02em;
    color:var(--muted);
    transform-origin:50% 60%;
    will-change:transform,filter,opacity;
  }
  .tip.fly-out{animation:tipOut .4s cubic-bezier(.32,.72,.36,1) forwards;}
  .tip.rise-in{animation:tipIn .7s cubic-bezier(.24,.7,.3,1) both;}

  @keyframes tipOut{
    0%{transform:translateY(0) rotate(0);filter:blur(0);opacity:1;}
    100%{transform:translateY(-1.5em) rotate(-3deg);filter:blur(8px);opacity:0;}
  }
  @keyframes tipIn{
    0%{transform:translateY(1.5em) scale(.96);filter:blur(10px);opacity:0;}
    55%{transform:translateY(-.1em) scale(1.012);filter:blur(1px);opacity:1;}
    72%{transform:translateY(.04em) scale(.998);filter:blur(0);}
    88%{transform:translateY(-.06em) scale(1.004);}
    100%{transform:translateY(0) scale(1);filter:blur(0);opacity:1;}
  }

  .btn{
    appearance:none;
    border:0;
    background:var(--accent);
    color:var(--on-theme);
    position:relative;
    overflow:hidden;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 14px 30px -14px color-mix(in srgb,var(--accent) 55%,#000 45%),0 2px 6px rgba(0,0,0,.05);
    font:inherit;
    font-size:16px;
    font-weight:600;
    letter-spacing:.22em;
    height:58px;
    min-width:min(248px,72vw);
    padding:0 .22em;
    border-radius:var(--r);
    cursor:pointer;
  }
  .btn .bt{
    position:relative;
    z-index:3;
    display:block;
    transition:transform .4s cubic-bezier(.24,.7,.3,1),opacity .24s ease;
  }
  .btn .bh{
    position:absolute;
    inset:0;
    z-index:3;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:15px;
    letter-spacing:.12em;
    opacity:0;
    transform:translateY(16px);
    pointer-events:none;
    transition:transform .42s cubic-bezier(.24,.7,.3,1),opacity .3s ease;
  }
  .btn::after{
    content:"";
    position:absolute;
    top:-30%;
    left:-45%;
    width:35%;
    height:160%;
    z-index:2;
    background:linear-gradient(100deg,transparent 0%,rgba(255,255,255,.62) 50%,transparent 100%);
    transform:skewX(-16deg);
    pointer-events:none;
    transition:left .68s cubic-bezier(.3,.72,.3,1);
  }
  .btn:hover::after{left:118%;}
  .btn[data-mode="start"]:hover .bt{transform:translateY(-20px);opacity:0;}
  .btn[data-mode="start"]:hover .bh{transform:translateY(0);opacity:1;}
  .btn[data-mode="read"]{pointer-events:none;cursor:default;}
  .btn[data-mode="stop"]{background:color-mix(in srgb,var(--accent) 78%,#000 22%);color:var(--on-theme);}
  .btn[data-mode="stop"]:hover{background:color-mix(in srgb,var(--accent) 70%,#000 30%);}
  .btn:disabled{background:color-mix(in srgb,var(--accent) 40%,#8E8B80 60%);color:#fff;cursor:default;box-shadow:none;}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

  .hint{
    margin:0;
    font-size:13px;
    color:var(--muted);
    letter-spacing:.03em;
    text-align:center;
  }
  .hint kbd{
    font:inherit;
    border:1px solid var(--line);
    border-bottom-width:2px;
    padding:1px 6px;
    border-radius:6px;
    color:var(--ink);
  }

  .cam{
    position:fixed;
    left:14px;
    bottom:14px;
    z-index:22;
    width:148px;
    background:#0F0F0D;
    border:1px solid var(--line);
    border-radius:var(--r);
    overflow:hidden;
    display:none;
  }
  .cam.on{display:block;}
  .cam video{
    display:block;
    width:100%;
    height:112px;
    object-fit:cover;
    transform:scaleX(-1);
    background:#0F0F0D;
  }
  .cam-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    padding:5px 7px;
    font-size:11px;
    letter-spacing:.04em;
    color:#E9E7DF;
    border-top:1px solid rgba(255,255,255,.12);
  }
  .cam-bar span:last-child{color:#fff;font-variant-numeric:tabular-nums;}
  #camSnap{
    display:none;
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:112px;
    background:#0F0F0D;
  }
  .cam.snap #camSnap{display:block;}

  /* ===== 今日点名排行 ===== */
  .rankBtn{
    position:fixed;
    right:14px;
    bottom:14px;
    z-index:24;
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--surface);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:var(--r);
    cursor:pointer;
    font-size:13px;
    line-height:1;
  }
  .rankBtn:hover{background:var(--surface);border-color:var(--accent-ink);color:var(--accent-ink);}
  .rankBtn[aria-expanded="true"]{background:var(--surface);border-color:var(--accent-ink);color:var(--accent-ink);}
  .rankBtn[aria-expanded="true"]:hover{background:var(--surface);border-color:var(--accent-ink);color:var(--accent-ink);}
  .rankBtn .rankArrow{display:block;transition:transform .2s cubic-bezier(.24,.7,.3,1);}
  .rankBtn[aria-expanded="true"] .rankArrow{transform:rotate(180deg);}

  .rankPanel{
    position:fixed;
    right:14px;
    bottom:74px;
    z-index:23;
    width:min(320px,calc(100vw - 28px));
    max-height:min(66vh,520px);
    overflow:auto;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--r);
    box-shadow:0 1px 3px rgba(var(--shc),.05),0 14px 30px -12px rgba(var(--shc),.22);
  }
  .rankPanel[hidden]{display:none;}
  @keyframes rankUp{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }
  .rankHead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    font-size:13px;
    letter-spacing:.02em;
  }
  .rankDate{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;}
  .rankDate{margin-left:auto;}
  .rankReset{
    padding:3px 9px;
    font:inherit;
    font-size:12px;
    color:var(--muted);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--r-sm);
    cursor:pointer;
    transition:color .16s cubic-bezier(.24,.7,.3,1),
               background-color .16s cubic-bezier(.24,.7,.3,1),
               border-color .16s cubic-bezier(.24,.7,.3,1);
  }
  .rankReset:hover{color:var(--ink);border-color:var(--ink);}

  .floatClose{
    position:fixed;
    z-index:40;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    background:var(--surface);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:var(--r);
    font:inherit;
    font-size:22px;
    line-height:1;
    cursor:pointer;
    box-shadow:
      0 1px 3px rgba(var(--shc),.07),
      0 10px 24px -10px rgba(var(--shc),.22);
    transition:color .16s cubic-bezier(.24,.7,.3,1),
               border-color .16s cubic-bezier(.24,.7,.3,1);
  }
  .floatClose:hover{color:var(--accent-ink);border-color:var(--accent-ink);}
  .floatClose:active{transform:scale(.96);}
  .floatClose[hidden]{display:none;}

  .rankClose{
    appearance:none;
    background:transparent;
    border:0;
    padding:2px 4px;
    min-width:30px;
    font:inherit;
    font-size:20px;
    line-height:1;
    color:var(--ink);
    cursor:pointer;
  }
  .rankClose:hover{color:var(--accent-ink);}

  .reset-sheet{width:min(360px,100%);}
  .reset-sheet .sheet-close{
    font-size:24px;
    line-height:1;
    min-height:48px;
    min-width:40px;
    padding:6px 6px 8px;
    color:var(--ink);
  }
  .reset-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    padding:20px 20px 8px;
  }
  .reset-body{
    margin:0;
    padding:0 20px 18px;
    font-size:14px;
    line-height:1.7;
    color:var(--muted);
  }
  .reset-ok{
    display:block;
    width:100%;
    min-height:52px;
    font:inherit;
    font-size:15px;
    color:var(--ink);
    background:var(--surface);
    border:0;
    border-top:1px solid var(--line);
    border-radius:0 0 var(--r) var(--r);
    cursor:pointer;
    transition:background-color .18s cubic-bezier(.24,.7,.3,1),
               color .18s cubic-bezier(.24,.7,.3,1);
  }
  .reset-ok:hover{background:#2F7D4F;color:#fff;}
  .reset-ok:focus-visible{outline:none;background:#2F7D4F;color:#fff;}
  .reset-ok:active{background:#276A43;color:#fff;}

  .rankTree{padding:6px 0 10px;}
  .rrow{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    padding:9px 14px;
    font:inherit;
    font-size:13px;
    color:inherit;
    background:none;
    border:0;
    border-bottom:1px solid var(--line-soft);
    text-align:left;
    cursor:pointer;
  }
  .rrow:hover{background:var(--hover);}
  .rrow:last-child{border-bottom:0;}
  .rrow.zero{color:var(--muted);}
  .lrank{color:var(--muted);font-size:11px;width:26px;font-variant-numeric:tabular-nums;}
  .ln{font-weight:600;font-variant-numeric:tabular-nums;min-width:1.9em;}
  .lc{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);}
  .rrow.zero .lc{color:var(--dim);}

  @media (max-width:520px){
    .rankPanel{width:calc(100vw - 28px);}
    .hud{gap:10px;font-size:12px;flex-wrap:wrap;justify-content:flex-end;}
    .dlg .set-row{padding:0 14px;}
    .dlg .set-cap,.dlg .set-note{padding-left:14px;padding-right:14px;}
  }

  /* ===== 学号格 ===== */
  .all{
    max-width:1040px;
    width:100%;
    margin:0 auto;
    padding:0 20px 34px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    border-top:1px solid var(--line);
    border-left:1px solid var(--line);
    border-radius:var(--r);
    overflow:hidden;
  }

  .cell{
    appearance:none;
    background:transparent;
    border:0;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    border-radius:0;
    font:inherit;
    min-height:44px;
    padding:9px 0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13.5px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
    letter-spacing:.03em;
    cursor:pointer;
  }
  .cell:hover{color:var(--ink);background:#F2F1EC;}
  .cell:active{background:var(--press);}
  .cell:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;color:var(--ink);}
  .cell.on{background:color-mix(in srgb,var(--accent) 58%,#FFFFFF 42%);color:var(--on-theme);font-weight:600;}
  .cell.on:hover{background:color-mix(in srgb,var(--accent) 72%,#FFFFFF 28%);color:var(--on-theme);}

  /* ===== 关于：自定义浮层 ===== */
  .mask{
    position:fixed;
    inset:0;
    z-index:30;
    background:transparent;
    display:block;
    padding:0;
  }
  .mask[hidden]{display:none;}

  .sheet{
    background:var(--surface);
    color:var(--ink);
    border:0;
    border-radius:var(--r);
    position:fixed;
    width:min(420px,100%);
    margin:0;
    max-height:calc(100vh - 32px);
    overflow:auto;
    box-shadow:
      0 0 0 1px rgba(var(--shc),.05),
      0 1px 3px rgba(var(--shc),.05),
      0 12px 28px -10px rgba(var(--shc),.18),
      0 40px 80px -26px rgba(var(--shc),.26);
    transform-origin:50% 60%;
    will-change:transform,filter,opacity;
  }

  .sheet-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
  }
  .sheet-head h3{
    margin:0;
    font-size:13px;
    font-weight:600;
    letter-spacing:.16em;
  }
  .sheet-close{
    appearance:none;
    background:transparent;
    border:0;
    color:var(--muted);
    font:inherit;
    font-size:13px;
    padding:8px 4px;
    min-height:44px;
    cursor:pointer;
    letter-spacing:.06em;
  }
  .sheet-close:hover{color:var(--ink);}
  .sheet-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .sheet-body{padding:22px 16px 20px;}
  .sheet-body p{margin:0;font-size:15px;line-height:1.85;letter-spacing:.01em;}

  .gh{
    display:inline-flex;
    align-items:center;
    min-height:32px;
    margin-top:3px;
    font-size:14.5px;
    font-weight:600;
    letter-spacing:.02em;
    color:var(--accent);
    text-decoration:none;
    transition:color .16s cubic-bezier(.24,.7,.3,1);
  }
  .gh:hover{color:var(--ink);}
  .gh:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}



  /* ===== 开场 ===== */
  .intro{
    position:fixed;
    inset:0;
    z-index:90;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--paper);
    overflow:hidden;
    will-change:filter,opacity,transform;
  }
  .intro[hidden]{display:none;}
  .intro-inner{
    position:relative;
    width:min(100vw,440px);
    height:220px;
  }
  .intro-logo{
    position:absolute;
    left:50%;
    top:50%;
    width:74px;
    height:auto;
    transform:translate(-50%,-50%);
    transform-origin:50% 50%;
    z-index:2;
  }
  .intro-text{
    position:absolute;
    left:50%;
    top:50%;
    margin-left:clamp(22px,6.4vw,34px);
    transform:translateY(-50%);
    white-space:nowrap;
    font-family:"MSZ Intro","Hanzipen SC","STKaiti","KaiTi",cursive;
    font-size:clamp(17px,4.8vw,24px);
    font-weight:400;
    letter-spacing:.02em;
    color:#F0C75E;
    z-index:1;
    clip-path:inset(0 100% 0 0);
  }
  /* ===== 设置 ===== */
  .mask.dim{
    background:rgba(var(--shc),.34);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
  }
  .dlg{
    background:var(--surface);
    color:var(--ink);
    border-radius:var(--r);
    width:min(440px,100%);
    max-height:calc(100vh - 36px);
    overflow:auto;
    box-shadow:
      0 0 0 1px rgba(var(--shc),.05),
      0 2px 6px rgba(var(--shc),.06),
      0 18px 40px -14px rgba(var(--shc),.24),
      0 48px 90px -34px rgba(var(--shc),.3);
  }
  .dlg[hidden]{display:none;}
  .mask.dim[hidden]{display:none;}
  .dlg-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px 14px;
    border-bottom:1px solid var(--line);
  }
  .dlg-head h3{margin:0;font-size:15px;font-weight:600;letter-spacing:.04em;}
  .dlg-x{
    appearance:none;
    background:transparent;
    border:0;
    padding:2px 4px;
    min-width:34px;
    font:inherit;
    font-size:22px;
    line-height:1;
    color:var(--ink);
    cursor:pointer;
  }
  .dlg-x:hover{color:var(--accent-ink);}
  .dlg-body{padding:4px 0 14px;}
  .set-cap{
    padding:14px 18px 8px;
    font-size:12px;
    color:var(--muted);
    letter-spacing:.08em;
  }
  .set-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    min-height:50px;
    padding:0 18px;
    border-top:1px solid var(--line-soft);
    font-size:14px;
  }
  .set-row:last-child{border-bottom:1px solid var(--line-soft);}
  .set-note{
    margin:0;
    padding:8px 18px 2px;
    font-size:12px;
    line-height:1.6;
    color:var(--muted);
  }
  .stepper{display:flex;align-items:center;gap:8px;}
  .stepper button{
    width:32px;
    height:32px;
    padding:0;
    font:inherit;
    font-size:16px;
    line-height:1;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--r-sm);
    cursor:pointer;
  }
  .stepper button:hover{border-color:var(--ink);}
  .stepper button:active{transform:scale(.96);}
  .stepper input{
    width:62px;
    height:32px;
    padding:0 4px;
    font:inherit;
    font-size:14px;
    text-align:center;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--r-sm);
    font-variant-numeric:tabular-nums;
    -moz-appearance:textfield;
  }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .sw{
    position:relative;
    flex:none;
    width:46px;
    height:26px;
    padding:0;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:999px;
    cursor:pointer;
    transition:background-color .18s cubic-bezier(.24,.7,.3,1),
               border-color .18s cubic-bezier(.24,.7,.3,1);
  }
  .sw i{
    position:absolute;
    left:3px;
    top:3px;
    width:18px;
    height:18px;
    border-radius:999px;
    background:var(--muted);
    transition:transform .2s cubic-bezier(.2,.9,.3,1),
               background-color .18s cubic-bezier(.24,.7,.3,1);
  }
  .swatches{display:flex;align-items:center;gap:8px;}
  .egg-stop{
    position:fixed;
    right:20px;
    bottom:calc(20px + env(safe-area-inset-bottom));
    z-index:140;
    appearance:none;
    background:#C0392B;
    color:#FFFFFF;
    border:0;
    font:inherit;
    font-size:15px;
    font-weight:600;
    letter-spacing:.1em;
    height:46px;
    padding:0 20px;
    border-radius:var(--r);
    cursor:pointer;
    box-shadow:0 12px 28px -12px rgba(192,57,43,.9);
  }
  .egg-stop:hover{background:#A62F23;}

  .egg-btn{
    appearance:none;
    background:transparent;
    border:1px solid #C0392B;
    color:#C0392B;
    font:inherit;
    font-size:14px;
    font-weight:600;
    letter-spacing:.08em;
    height:44px;
    width:auto;
    padding:0 22px;
    align-self:flex-start;
    position:relative;
    overflow:hidden;
    border-radius:var(--r-sm);
    cursor:pointer;
    transition:background .28s ease,color .28s ease,border-color .28s ease;
  }
  .egg-btn::after{
    content:"";
    position:absolute;
    top:-30%;
    left:-55%;
    width:45%;
    height:160%;
    background:linear-gradient(100deg,transparent 0%,rgba(255,255,255,.55) 50%,transparent 100%);
    transform:skewX(-16deg);
    pointer-events:none;
    transition:left .6s cubic-bezier(.3,.72,.3,1);
  }
  .egg-btn:hover{background:#C0392B;border-color:#C0392B;color:#FFFFFF;}
  .egg-btn:hover::after{left:120%;}
  .egg-btn:active{background:#A62F23;border-color:#A62F23;}
  .egg-btn:focus-visible{outline:2px solid #C0392B;outline-offset:2px;}

  .dot{
    width:26px;
    height:26px;
    padding:0;
    border:1px solid rgba(var(--shc),.12);
    border-radius:999px;
    cursor:pointer;
    background:var(--c);
    box-shadow:0 0 0 0 transparent;
    transition:box-shadow .16s cubic-bezier(.24,.7,.3,1),transform .16s cubic-bezier(.24,.7,.3,1);
  }
  .dot:hover{transform:translateY(-1px);}
  .dot.active{box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--ink);}
  .dot-pick{
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:conic-gradient(from 90deg,#C43C22,#2F5D8A,#2F7D4F,#8A6A2F,#C43C22);
  }
  .dot-pick input{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    padding:0;
    border:0;
    opacity:0;
    cursor:pointer;
  }
  .dot-pick::after{
    content:"";
    position:absolute;
    inset:4px;
    border-radius:999px;
    background:var(--surface);
    opacity:.62;
    pointer-events:none;
  }
  .sw[data-on="1"]{background:var(--ink);border-color:var(--ink);}
  .sw[data-on="1"] i{transform:translateX(20px);background:var(--surface);}

  @media (prefers-color-scheme: dark){
    .rankBtn:hover,#gestBtn:hover{background:var(--surface);border-color:var(--accent-ink);color:var(--accent-ink);}
    .btn:disabled{background:#3A3931;border-color:#3A3931;color:#8E8C80;}
    .mask.dim{background:rgba(0,0,0,.62);}
    .rankPanel,.sheet,.dlg{box-shadow:0 0 0 1px var(--line),0 22px 52px -18px rgba(0,0,0,.85);}
    .logo{background:transparent;}
    .cam{border-color:var(--line);}
    .sw[data-on="1"]{background:var(--accent);border-color:var(--accent);}
    .sw[data-on="1"] i{background:#FFFDF6;}
    .grid{background:var(--surface);}
    .rrow:hover{background:var(--hover);}
  }

  /* ===== 统一按钮手感 + 浮层动效 ===== */
  .logo,
  .snd,
  .btn,
  .cell,
  .sheet-close{
    transition:transform .16s cubic-bezier(.24,.7,.3,1),
               background-color .16s cubic-bezier(.24,.7,.3,1),
               color .16s cubic-bezier(.24,.7,.3,1),
               border-color .16s cubic-bezier(.24,.7,.3,1);
  }
  .logo:hover,
  .snd:hover,
  .btn:hover,
  .cell:hover,
  .sheet-close:hover{transform:translateY(-1px);}
  .logo:active,
  .snd:active,
  .btn:active,
  .cell:active,
  .sheet-close:active{transform:translateY(1px) scale(.975);}
  .btn:disabled,
  .btn:disabled:active{transform:none;}

  .mask:not([hidden]){animation:none;}
  .mask.is-closing{animation:none;}
  .sheet,.rankPanel{transform-origin:50% 50%;}

  @keyframes maskIn{from{opacity:0;}to{opacity:1;}}
  @keyframes maskOut{from{opacity:1;}to{opacity:0;}}
  @keyframes sheetIn{
    0%{opacity:0;transform:translateY(30px) scale(.94);filter:blur(14px);}
    55%{opacity:1;transform:translateY(-6px) scale(1.012);filter:blur(2px);}
    72%{transform:translateY(2px) scale(.998);filter:blur(0);}
    86%{transform:translateY(-3px) scale(1.004);}
    100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}
  }
  @keyframes sheetOut{
    0%{opacity:1;transform:translateY(0) scale(1) rotate(0);filter:blur(0);}
    28%{opacity:.95;transform:translateY(-10px) scale(1.012) rotate(-.8deg);filter:blur(2px);}
    100%{opacity:0;transform:translateY(-64px) scale(.9) rotate(-2.4deg);filter:blur(14px);}
  }

  @media (min-width:640px){
    header{padding:24px 28px 8px;}
    .logo{width:58px;height:58px;}
    .hud{font-size:14px;gap:20px;}
    .snd{font-size:14px;}
    main{gap:34px;padding:24px 28px 64px;}
  }

  /* ===== 手机端（鸿蒙等窄屏） ===== */
  @media (max-width:599px){
    body{
      overscroll-behavior-y:none;
      -webkit-text-size-adjust:100%;
    }
    header{
      padding:calc(10px + env(safe-area-inset-top)) 16px 0;
      gap:10px;
      align-items:flex-start;
    }
    .logo{width:44px;height:44px;}
    .intro-logo{width:64px;}
    .intro-inner{height:200px;}
    .hud{
      flex:1;
      min-width:0;
      justify-content:flex-end;
      align-items:center;
      gap:12px;
      font-size:11.5px;
      flex-wrap:nowrap;
    }
    .hud .count{display:none;}
    .ver{display:none;}
    .snd{
      min-height:44px;
      padding:6px 0;
      font-size:11.5px;
      gap:4px;
    }
    .snd .st{font-size:10.5px;}
    .snd svg{width:14px;height:14px;}

    main{
      gap:14px;
      padding:6px 16px 14px;
      justify-content:center;
    }
    .stage{min-height:clamp(140px,26vh,240px);}
    .num{font-size:clamp(92px,27vw,168px);}
    .unit{font-size:clamp(16px,4.4vw,24px);}
    .tip{font-size:13px;line-height:1.6;max-width:88vw;}

    .btn{
      width:100%;
      min-width:0;
      height:52px;
      font-size:15px;
      letter-spacing:.16em;
    }

    .all{
      padding:0 16px calc(18px + env(safe-area-inset-bottom));
    }
    .grid{
      grid-template-columns:repeat(6,1fr);
    }
    .cell{
      min-height:46px;
      font-size:13px;
      padding:0;
    }

    .rankBtn{
      right:calc(14px + env(safe-area-inset-right));
      bottom:calc(14px + env(safe-area-inset-bottom));
      width:46px;
      height:46px;
    }
    .rankPanel{
      left:calc(14px + env(safe-area-inset-left));
      right:calc(14px + env(safe-area-inset-right));
      width:auto;
      bottom:calc(70px + env(safe-area-inset-bottom));
      max-height:64vh;
    }

    .mask.dim{padding:14px;}
    .dlg{
      width:100%;
      max-height:calc(100vh - 28px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    }
    .dlg-head{padding:14px 16px 12px;}
    .set-row{min-height:52px;padding:0 16px;}
    .set-cap,.set-note{padding-left:16px;padding-right:16px;}
    .set-cap{padding-top:12px;}

    .sheet{
      width:calc(100vw - 24px);
      max-height:calc(100vh - 24px - env(safe-area-inset-top));
    }
  }

  @media (max-width:380px){
    .hud{gap:8px;}
    .snd{font-size:11px;gap:3px;}
    .snd .st{display:none;}
    .num{font-size:clamp(84px,26vw,140px);}
  }

  @media (max-height:520px) and (orientation:landscape){
    header{padding-top:calc(8px + env(safe-area-inset-top));}
    .logo{width:38px;height:38px;}
    main{flex-direction:row;justify-content:center;gap:20px;padding:0 16px 10px;}
    .stage{flex:1;min-height:0;}
    .num{font-size:clamp(64px,14vh,120px);}
    .btn{width:auto;min-width:180px;height:48px;}
    .all{padding-bottom:calc(12px + env(safe-area-inset-bottom));}
    .cell{min-height:38px;}
  }


  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>
</head>
<body>

  <script>
  (function () {
    var intro = document.getElementById('intro');
    if (!intro) return;
    var mm = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
    if (mm && mm.matches) { intro.parentNode.removeChild(intro); return; }

    var logo = document.getElementById('introLogo');
    var text = document.getElementById('introText');
    if (!logo || !text || !intro.animate) { intro.parentNode.removeChild(intro); return; }

    var narrow = window.innerWidth < 600;
    var shift = narrow ? 50 : 78;
    var done = false;

    function finish() {
      if (done) return;
      done = true;
      if (intro.getAnimations) intro.getAnimations().forEach(function (a) { a.cancel(); });
      if (intro.parentNode) intro.parentNode.removeChild(intro);
    }

    logo.animate([
      { opacity: 0, transform: 'translate(-50%,-50%) scale(.9)' },
      { opacity: 1, transform: 'translate(-50%,-50%) scale(1)' }
    ], { duration: 320, easing: 'cubic-bezier(.2,.85,.3,1)', fill: 'both' });

    setTimeout(function () {
      logo.animate([
        { transform: 'translate(-50%,-50%) scale(1)' },
        { transform: 'translate(calc(-50% - ' + shift + 'px),-50%) scale(1)' }
      ], { duration: 540, easing: 'cubic-bezier(.3,.9,.24,1)', fill: 'forwards' });

      text.animate([
        { clipPath: 'inset(0 100% 0 0)', opacity: 0 },
        { clipPath: 'inset(0 -4% 0 0)', opacity: 1 }
      ], { duration: 540, easing: 'cubic-bezier(.3,.9,.24,1)', fill: 'forwards' });
    }, 360);

    setTimeout(function () {
      intro.animate([
        { filter: 'blur(0px)', opacity: 1, transform: 'none' },
        { filter: 'blur(18px)', opacity: 0, transform: 'translateY(56px)' }
      ], { duration: 560, easing: 'cubic-bezier(.42,0,.72,.4)', fill: 'forwards' });
    }, 1240);

    setTimeout(finish, 1840);
  })();
  </script>

  /* ---------- ！冷知识提示！ ---------- */

  /* ---------- 朗读 ---------- */
  function reduceMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function pickZhVoice() {
    if (voiceChecked) return zhVoice;
    if (!('speechSynthesis' in window)) return null;
    var vs = window.speechSynthesis.getVoices() || [];
    var zh = vs.filter(function (v) { return /^zh/i.test(v.lang); });
    if (zh.length) {
      zhVoice = zh.filter(function (v) { return v.localService; })[0] || zh[0];
      voiceChecked = true;
    }
    return zhVoice;
  }

  if ('speechSynthesis' in window) {
    try {
      window.speechSynthesis.addEventListener('voiceschanged', function () {
        voiceChecked = false;
        pickZhVoice();
      });
    } catch (e) {}
  }

  var DIGITS = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
  function cnNum(n) {
    if (n < 10) return DIGITS[n];
    if (n < 20) return '十' + (n % 10 ? DIGITS[n % 10] : '');
    var t = Math.floor(n / 10), o = n % 10;
    return DIGITS[t] + '十' + (o ? DIGITS[o] : '');
  }

  function speakNumber(n, onDone) {
    var token = ++readToken;
    var finished = false;

    function finish() {
      if (finished || token !== readToken) return;
      finished = true;
      clearTimeout(readFallback);
      if (onDone) onDone();
    }

    if (!soundOn || !('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
      readFallback = setTimeout(finish, 550);
      return;
    }

    var synth = window.speechSynthesis;
    try {
      synth.cancel();
      var u = new SpeechSynthesisUtterance('请' + cnNum(n) + '号上台');
      u.lang = 'zh-CN';
      u.rate = 0.95;
      u.pitch = 1;
      u.volume = 1;
      var v = pickZhVoice();
      if (v) u.voice = v;
      u.onend = function () {
        if (talking === u) talking = null;
        finish();
      };
      u.onerror = function () {
        if (talking === u) talking = null;
        finish();
      };
      talking = u;
      readFallback = setTimeout(finish, 9000);
      setTimeout(function () {
        if (synth.paused) synth.resume();
        synth.speak(u);
      }, 150);
    } catch (e) {
      readFallback = setTimeout(finish, 550);
    }
  }

  /* ---------- 语音操控 ---------- */
  var REC = window.SpeechRecognition || window.webkitSpeechRecognition;

  function initRec() {
    if (rec || !REC) return rec;
    rec = new REC();
    rec.lang = 'zh-CN';
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 3;

    var interimTimer = null;
    var interimCandidate = 0;

    function fireNumber(n) {
      clearTimeout(interimTimer);
      interimCandidate = 0;
      var now = Date.now();
      // 刚念过的号在冷却期内的重复识别一律丢掉，防止把自己的声音当成新指令反复循环
      if (n === lastReadNumber && now < dedupeUntil) return;
      lastReadNumber = n;
      dedupeUntil = now + 2200;
      onVoiceNumber(n);
    }

    rec.onresult = function (e) {
      if (recIgnore) return;

      var finalText = '';
      var interimText = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var r = e.results[i];
        var tr = r[0] && r[0].transcript ? r[0].transcript : '';
        if (r.isFinal) finalText += tr;
        else interimText += tr;
      }

      var heard = finalText || interimText;
      if (!heard) return;

      if (G.on && (heard.indexOf('截图') >= 0 || heard.indexOf('截屏') >= 0 || heard.indexOf('拍照') >= 0)) {
        if (finalText) { clearTimeout(interimTimer); doSnap(); }
        return;
      }
      if (!voiceMode) return;

      var n = parseSpoken(heard);
      if (!n || ALL.indexOf(n) === -1) {
        interimCandidate = 0;
        clearTimeout(interimTimer);
        return;
      }

      if (finalText) { fireNumber(n); return; }

      var hasUnit = /号/.test(heard);
      if (n !== interimCandidate) {
        interimCandidate = n;
        clearTimeout(interimTimer);
        interimTimer = setTimeout(function () { fireNumber(n); }, hasUnit ? 90 : 420);
      } else if (hasUnit && !interimTimer) {
        interimTimer = setTimeout(function () { fireNumber(n); }, 90);
      }
    };

    rec.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        setVoiceMode(false);
        voiceState.textContent = '无权限';
      }
    };

    rec.onend = function () {
      recRunning = false;
      if (voiceMode && recShouldRun && !recIgnore) {
        clearTimeout(recRestartTimer);
        recRestartTimer = setTimeout(startListening, 150);
      }
    };
    return rec;
  }

  function startListening() {
    if (!voiceMode || !rec || recRunning || !recShouldRun) return;
    try {
      rec.start();
      recRunning = true;
    } catch (e) {
      recRunning = false;
    }
  }

  function stopListening() {
    recShouldRun = false;
    recIgnore = false;
    clearTimeout(recRestartTimer);
    clearTimeout(recGuardTimer);
    if (!rec) return;
    try { rec.abort(); } catch (e) {}
    recRunning = false;
  }

  function resumeListening() {
    if (!voiceMode || !rec) return;
    recShouldRun = true;
    startListening();
  }

  /* 朗读期间不关麦克风，只是暂时忽略识别结果（避免重开麦克风时反复求授权） */
  function muteRec() {
    recIgnore = true;
    clearTimeout(recGuardTimer);
  }

  function unmuteRec() {
    clearTimeout(recGuardTimer);
    if (!voiceMode) { recIgnore = false; return; }
    dedupeUntil = Math.max(dedupeUntil, Date.now() + 2200);
    recGuardTimer = setTimeout(function () { recIgnore = false; }, 600);
    resumeListening();
  }

  function onVoiceNumber(n) {
    muteRec();
    pickManual(n);
  }

  function updateHint() {
    if (!hintText) return;
    if (voiceMode) {
      hintText.innerHTML = '语音模式：说「五十一号」就会念出来';
      return;

    hintText.innerHTML = inputTouch
      ? '点按钮开始、停止 · 点学号直接念'
      : '按 <kbd>空格</kbd> 开始、停止';

  function setInputTouch(on) {
    if (on === inputTouch) return;
    inputTouch = on;
    updateHint();
  }

  document.addEventListener('pointerdown', function (e) {
    var t = e.pointerType;
    if (t === 'touch' || t === 'pen') setInputTouch(true);
    else if (t === 'mouse') setInputTouch(false);
  }, true);

  document.addEventListener('touchstart', function () { setInputTouch(true); }, { passive: true, capture: true });

  document.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.code === 'Space') setInputTouch(false);
  }, true);

  function setVoiceMode(on) {
    voiceMode = on;
    if (voiceBtn) {
      voiceBtn.setAttribute('data-on', on ? '1' : '0');
      voiceBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      voiceState.textContent = on ? '听' : '关';

    updateHint();

    if (!on) { stopListening(); if (G.on) startSnapListen(); return; }
    stopSnapListen();
    if (!REC) {
      voiceState.textContent = '不支持';
      voiceMode = false;
      return;
    }
    initRec();
    recShouldRun = true;
    startListening();
  }

  function cn2num(str) {
    var map = { 零: 0, 〇: 0, 一: 1, 壹: 1, 二: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
    var s = str.replace(/[零〇]/g, '零').replace(/两/g, '二').replace(/壹/g, '一');
    if (/^[0-9]+$/.test(s)) return parseInt(s, 10);
    var m = s.match(/^([一二三四五六七八九])?十([一二三四五六七八九])?$/);
    if (m) return (m[1] ? map[m[1]] : 1) * 10 + (m[2] ? map[m[2]] : 0);
    if (s.length === 1 && typeof map[s] === 'number') return map[s];
    return NaN;
  }

  function parseSpoken(text) {
    var t = String(text || '').replace(/\s/g, '').replace(/[，。、！？,.!?]/g, '');
    var d = t.match(/([0-9]{1,2})/);
    if (d) {
      var a = parseInt(d[1], 10);
      if (a >= 1 && a <= 51) return a;
    }
    var c = t.match(/([一二三四五六七八九两壹]?十[一二三四五六七八九零]?|[一二三四五六七八九两壹])\s*号?/);
    if (c) {
      var b = cn2num(c[1]);
      if (!isNaN(b)) return b;
    }
    return NaN;
  }

  /* ---------- 换号动画 ---------- */
  function swapNumber(n, onSwapped) {
    var token = ++animToken;
    var hasOld = showingNumber;

    numEl.classList.remove('fly-out', 'rise-in');
    void numEl.offsetWidth;

    function putIn() {
      if (token !== animToken) return;
      show(n, false);
      showingNumber = true;
      numEl.classList.remove('fly-out');
      void numEl.offsetWidth;
      numEl.classList.add('rise-in');
      if (onSwapped) onSwapped();
      setTimeout(function () {
        if (token === animToken) numEl.classList.remove('rise-in');
      }, 900);
    }

    if (!hasOld || reduceMotion()) { putIn(); return; }

    var done = false;
    function outEnd() {
      if (done) return;
      done = true;
      numEl.removeEventListener('animationend', outEnd);
      putIn();
    }
    numEl.classList.add('fly-out');
    numEl.addEventListener('animationend', outEnd);
    setTimeout(outEnd, 470);
  }

  function show(n, dim) {
    numEl.textContent = n;
    numEl.classList.toggle('dim', !!dim);
    unitEl.classList.remove('off');
  }

  function randomN() {
    return ALL[Math.floor(Math.random() * ALL.length)];
  }

  var readingLock = false;

  function beginReading() {
    readingLock = true;
    pickBtn.dataset.mode = 'read';
    pickLabel.textContent = '正在朗读中';
    pickBtn.setAttribute('aria-disabled', 'true');
  }

  function endReading() {
    if (!readingLock) return;
    readingLock = false;
    pickBtn.setAttribute('aria-disabled', 'false');
    restIdle();
  }

  function restIdle() {
    state = 'idle';
    pickBtn.disabled = false;
    pickBtn.dataset.mode = 'start';
    pickLabel.textContent = '再来一次';
  }

  /* ---------- 念完收回号码，回到提示 ---------- */
  function afterReading() {
    if (readEnding || !showingNumber) return;
    readEnding = true;
    var token = areaToken;

    function toTips() {
      if (token !== areaToken) return;
      backToTips(true);
    }

    if (reduceMotion()) { toTips(); return; }
    numEl.classList.remove('rise-in');
    numEl.classList.add('fly-out');
    setTimeout(toTips, 430);
  }

  /* ---------- 点学号：立刻落定并念 ---------- */
  function pickManual(n) {
    if (state === 'settling') return;
    clearTimeout(rollTimer);
    muteRec();
    lastReadNumber = n;
    dedupeUntil = Date.now() + 2200;
    noteNamed(n);
    enterNumberMode();
    animToken++;
    showingNumber = false;
    highlight(n);
    clearHighlight();
    restIdle();
    beginReading();
    swapNumber(n, function () { speakNumber(n, afterReading); });
  }

  /* ---------- 随机滚动 ---------- */
  function startRoll() {
    state = 'rolling';
    muteRec();
    enterNumberMode();
    showingNumber = true;
    numEl.classList.remove('fly-out', 'rise-in');
    pickBtn.dataset.mode = 'stop';
    pickLabel.textContent = '停止';
    highlight(null);
    unitEl.classList.add('off');

    var tick = function () {
      show(randomN(), true);
      rollTimer = setTimeout(tick, 55);
    };
    tick();
  }

  function settle() {
    clearTimeout(rollTimer);
    state = 'settling';
    pickBtn.disabled = true;
    pickLabel.textContent = '抽号中';

    var final = randomN();
    var delays = [65, 75, 88, 105, 125, 150, 185, 225];
    var step = 0;

    var next = function () {
      if (step < delays.length) {
        show(randomN(), true);
        rollTimer = setTimeout(next, delays[step++]);
        return;
      }
      show(final, false);
      showingNumber = true;
      numEl.classList.remove('rise-in');
      void numEl.offsetWidth;
      numEl.classList.add('rise-in');
      setTimeout(function () { numEl.classList.remove('rise-in'); }, 900);
      highlight(final);
      noteNamed(final);
      lastReadNumber = final;
      dedupeUntil = Date.now() + 2200;
      restIdle();
      beginReading();
      speakNumber(final, afterReading);
    };
    next();
  }

  /* ---------- 隔空点击（摄像头 + 截图识别手势） ---------- */
  var MP_BASE = 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/';
  var gestBtn = document.getElementById('gestBtn');
  var gestState = document.getElementById('gestState');
  var camBox = document.getElementById('camBox');
  var camVideo = document.getElementById('camVideo');
  var camState = document.getElementById('camState');
  var camSnap = document.getElementById('camSnap');
  var camSnapCtx = camSnap.getContext('2d');

  var G = { on: false, model: null, stream: null, busy: false, onceResult: null };

  function pd(a, b) {
    var dx = a.x - b.x, dy = a.y - b.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function fingerStraight(lm, mcp, pip, tip) {
    var d1 = pd(lm[mcp], lm[pip]);
    var d2 = pd(lm[pip], lm[tip]);
    var d3 = pd(lm[mcp], lm[tip]);
    return d3 > (d1 + d2) * 0.86;
  }

  function digitOf(lm) {
    var scale = pd(lm[0], lm[9]) || 0.01;
    var idx = fingerStraight(lm, 5, 6, 8);
    var mid = fingerStraight(lm, 9, 10, 12);
    var rng = fingerStraight(lm, 13, 14, 16);
    var pky = fingerStraight(lm, 17, 18, 20);
    var thb = fingerStraight(lm, 2, 3, 4) && pd(lm[4], lm[5]) > scale * 0.42;
    var pinch = pd(lm[4], lm[8]) < scale * 0.45;
    var cnt = (idx ? 1 : 0) + (mid ? 1 : 0) + (rng ? 1 : 0) + (pky ? 1 : 0);

    if (pinch && !mid && !rng && !pky) return 7;
    if (thb && pky && !idx && !mid && !rng) return 6;
    if (cnt === 4 && thb) return 5;
    if (thb && idx && cnt === 1) return 8;
    if (cnt === 0 && !thb) return 0;
    return cnt;
  }

  function combineDigits(digits, count) {
    if (!count) return null;
    if (count === 1) return ALL.indexOf(digits[0]) !== -1 ? digits[0] : null;
    if (digits[0] <= 0 || digits[0] > 9 || digits[1] > 9) return null;
    var cands = [digits[0] * 10 + digits[1], digits[1] * 10 + digits[0]];
    for (var i = 0; i < cands.length; i++) {
      if (ALL.indexOf(cands[i]) !== -1) return cands[i];
    }
    return null;
  }

  function ensureModel() {
    if (G.model || typeof Hands === 'undefined') return;
    try {
      var h = new Hands({ locateFile: function (f) { return MP_BASE + f; } });
      h.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.4,
        minTrackingConfidence: 0.4
      });
      h.onResults(function (res) {
        if (G.onceResult) {
          var f = G.onceResult;
          G.onceResult = null;
          f(res);
        }
      });
      G.model = h;
    } catch (e) {
      G.model = null;
    }
  }

  function sendPass(canvas) {
    return new Promise(function (resolve) {
      var settled = false;
      var done = function (res) {
        if (settled) return;
        settled = true;
        resolve(res || null);
      };
      G.onceResult = function (res) { done(res); };
      try {
        G.model.send({ image: canvas }).then(function () {}, function () { done(null); });
      } catch (e) { done(null); }
      setTimeout(function () { done(null); }, 2600);
    });
  }

  function clearSnap() {
    camSnapCtx.clearRect(0, 0, camSnap.width, camSnap.height);
    camBox.classList.remove('snap');
    G.busy = false;
    if (G.on) camState.textContent = '喊「截图」';
  }

  function drawSnap(base, best, digits, n) {
    var W = camSnap.width, H = camSnap.height;
    camSnapCtx.clearRect(0, 0, W, H);
    camSnapCtx.drawImage(base, 0, 0, W, H);

    if (best) {
      var c = best.crop;
      var bw = base.width, bh = base.height;
      best.res.multiHandLandmarks.forEach(function (lm, hi) {
        camSnapCtx.fillStyle = 'rgba(196,60,34,.95)';
        lm.forEach(function (pt) {
          var x = ((c.sx + pt.x * c.sw) / bw) * W;
          var y = ((c.sy + pt.y * c.sh) / bh) * H;
          camSnapCtx.beginPath();
          camSnapCtx.arc(x, y, 2.1, 0, Math.PI * 2);
          camSnapCtx.fill();
        });
        if (digits[hi] !== undefined) {
          var wx = ((c.sx + lm[0].x * c.sw) / bw) * W;
          var wy = ((c.sy + lm[0].y * c.sh) / bh) * H;
          camSnapCtx.fillStyle = '#fff';
          camSnapCtx.font = '600 20px "PingFang SC", sans-serif';
          camSnapCtx.textAlign = 'center';
          camSnapCtx.fillText(String(digits[hi]), wx, Math.min(H - 8, wy + 26));
        }
      });
    }
    camBox.classList.add('snap');
  }

  function doSnap() {
    if (!G.on || G.busy) return;
    if (!G.model) { camState.textContent = '模型未载'; return; }
    var v = camVideo;
    if (!v || v.readyState < 2) { camState.textContent = '等摄像头'; return; }
    G.busy = true;
    camState.textContent = '识别中';

    var cw = v.videoWidth || 1280, ch = v.videoHeight || 720;
    var base = document.createElement('canvas');
    base.width = cw;
    base.height = ch;
    base.getContext('2d').drawImage(v, 0, 0, cw, ch);

    var crops = [
      { sx: 0, sy: 0, sw: cw, sh: ch },
      { sx: cw * 0.19, sy: ch * 0.17, sw: cw * 0.62, sh: ch * 0.66 },
      { sx: cw * 0.32, sy: ch * 0.28, sw: cw * 0.36, sh: ch * 0.44 }
    ];

    var hits = [];
    var idx = 0;

    function step() {
      if (idx >= crops.length) { finish(); return; }
      var c = crops[idx++];
      var tmp = document.createElement('canvas');
      tmp.width = 640;
      tmp.height = 480;
      tmp.getContext('2d').drawImage(base, c.sx, c.sy, c.sw, c.sh, 0, 0, 640, 480);
      sendPass(tmp).then(function (res) {
        if (res && res.multiHandLandmarks && res.multiHandLandmarks.length) {
          hits.push({ res: res, crop: c });
        }
        step();
      });
    }

    function finish() {
      var best = null;
      hits.forEach(function (r) {
        var spans = r.res.multiHandLandmarks.map(function (lm) { return pd(lm[0], lm[9]); });
        var score = r.res.multiHandLandmarks.length * 10 + Math.max.apply(null, spans);
        if (!best || score > best.score) best = { res: r.res, crop: r.crop, score: score };
      });

      var digits = [], n = null;
      if (best) {
        var hands = best.res.multiHandLandmarks.slice(0, 2);
        hands.sort(function (x, y) { return pd(y[0], y[9]) - pd(x[0], x[9]); });
        digits = hands.map(function (lm) { return digitOf(lm); });
        n = combineDigits(digits, digits.length);
      }

      drawSnap(base, best, digits, n);

      if (!n) {
        camState.textContent = digits.length ? digits.join('·') + ' 无效' : '没找到手';
        setTimeout(clearSnap, 1600);
        return;
      }
      camState.textContent = (digits.length > 1 ? digits.join('·') + ' → ' : '') + n;
      pickManual(n);
      setTimeout(clearSnap, 3800);
    }

    step();
  }

  var snapRec = null, snapRunning = false, snapRetry = 0;

  function initSnapRec() {

      var txt = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) txt = e.results[i][0].transcript;
      }
      if (!txt) return;
      if (txt.indexOf('截图') >= 0 || txt.indexOf('截屏') >= 0 || txt.indexOf('拍照') >= 0) doSnap();

    snapRec.onerror = function (e) {

        if (G.on) camState.textContent = '话筒未授权 · 点小窗';
      }
    };
    snapRec.onend = function () {

  function startSnapListen() {

    initSnapRec();

    try { snapRec.start(); snapRunning = true; } catch (e) { snapRunning = false; }

  function stopSnapListen() {

    try { snapRec.abort(); } catch (e) {}

  function hideFloat(owner) {

    if (owner && floatOwner && owner !== floatOwner) return;

  function hideOrigin(btn) {
    if (!btn) return;

  }

  function showOrigin(btn) {
    if (!btn) return;

  }

  function placePanel(panel, btn, maxW) {
    var vw = document.documentElement.clientWidth;
    var vh = document.documentElement.clientHeight;
    var m = 16;

    panel.style.position = 'fixed';
    panel.style.right = 'auto';
    panel.style.bottom = 'auto';
    panel.style.width = Math.min(maxW, vw - m * 2) + 'px';
    panel.style.maxHeight = (vh - m * 2) + 'px';
    panel.style.left = '0px';
    panel.style.top = '0px';

    var w = panel.offsetWidth;
    var h = panel.offsetHeight;
    var b = btn.getBoundingClientRect();

    var left = (b.left + b.width / 2 > vw / 2) ? (b.right - w) : b.left;
    var top = (b.top + b.height / 2 > vh / 2) ? (b.bottom - h) : (b.bottom + 10);

    left = Math.min(Math.max(m, left), vw - m - w);
    top = Math.min(Math.max(m, top), vh - m - h);

    panel.style.left = left + 'px';
    panel.style.top = top + 'px';

    return { left: left, top: top, w: w, h: h, b: b };
  }

  function morphOpen(panel, btn, maxW, dur, mask) {
    if (!panel || !btn) return;
    if (mask) mask.hidden = false;
    if (panel.getAnimations) panel.getAnimations().forEach(function (a) { a.cancel(); });
    panel.hidden = false;

    var g = placePanel(panel, btn, maxW);
    if (!panel.animate || reduceMotion()) return;

    var sx = g.b.width / g.w;
    var sy = g.b.height / g.h;
    var tx = g.b.left - g.left;
    var ty = g.b.top - g.top;

    panel.style.transformOrigin = '0 0';
    panel.style.willChange = 'transform,filter,opacity';

    var anim = panel.animate([
      {
        transform: 'translate(' + tx + 'px,' + ty + 'px) scale(' + sx + ',' + sy + ')',
        borderRadius: '14px',
        filter: 'blur(2px)',
        opacity: 1,
        offset: 0
      },
      { filter: 'blur(10px)', offset: .2 },
      {
        transform: 'translate(' + (tx * .06) + 'px,' + (ty * .06) + 'px) scale(1.024,1.024)',
        filter: 'blur(3px)',
        offset: .56
      },
      { transform: 'scale(.996,.996)', filter: 'blur(0px)', offset: .76 },
      { transform: 'scale(1.005,1.005)', filter: 'blur(0px)', offset: .89 },
      { transform: 'none', filter: 'blur(0px)', offset: 1 }
    ], { duration: dur || 640, easing: 'cubic-bezier(.24,.7,.26,1)', fill: 'none' });

    anim.onfinish = function () { panel.style.willChange = ''; };
  }

  function morphClose(panel, btn, dur, done, mask) {
    if (!panel || !btn) { done(); return; }
    if (panel.getAnimations) panel.getAnimations().forEach(function (a) { a.cancel(); });

    var r = panel.getBoundingClientRect();
    var b = btn.getBoundingClientRect();
    var sx = Math.max(.04, b.width / Math.max(1, r.width));
    var sy = Math.max(.04, b.height / Math.max(1, r.height));
    var tx = b.left - r.left;
    var ty = b.top - r.top;

    if (!panel.animate || reduceMotion()) {
      if (mask) mask.hidden = true;
      done();
      return;
    }

    panel.style.transformOrigin = '0 0';
    panel.style.willChange = 'transform,filter,opacity';

    var anim = panel.animate([
      { transform: 'none', filter: 'blur(0px)', opacity: 1, offset: 0 },
      { filter: 'blur(6px)', offset: .22 },
      {
        transform: 'translate(' + (tx * .45) + 'px,' + (ty * .45) + 'px) scale(' + ((1 + sx) / 2) + ',' + ((1 + sy) / 2) + ')',
        filter: 'blur(8px)',
        opacity: 1,
        offset: .62
      },
      {
        transform: 'translate(' + tx + 'px,' + ty + 'px) scale(' + sx + ',' + sy + ')',
        filter: 'blur(2px)',
        opacity: 1,
        offset: 1
      }
    ], { duration: dur || 340, easing: 'cubic-bezier(.36,.02,.64,.28)', fill: 'forwards' });

    anim.onfinish = function () {
      anim.cancel();
      panel.style.willChange = '';
      if (mask) mask.hidden = true;
      done();
    };
  }

  /* ---------- 彩蛋 2：头像风暴 ---------- */
  var stormTimer = null;
  var stormLayer = null;

  function startAvatarStorm() {
    if (stormLayer) return;
    var srcEl = document.querySelector('.logo-color') || document.getElementById('introLogo');
    if (!srcEl) return;
    var src = srcEl.getAttribute('src');
    if (!src) return;

    // 先把页面停稳，否则满屏头像里根本点不到按钮
    clearInterval(chaosTimer);
    chaosTimer = null;
    document.body.style.transition = 'transform .4s ease';
    document.body.style.transform = 'none';

    stormLayer = document.createElement('div');
    stormLayer.setAttribute('aria-hidden', 'true');
    stormLayer.style.cssText = 'position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:130;';
    document.body.appendChild(stormLayer);

    var eggStop = document.getElementById('eggStop');
    if (eggStop) eggStop.hidden = false;

    // 伪随机：把屏幕切成格子，随机打乱后循环落子，落满一圈继续下一圈
  var cols = 6, rows = 4;
  var queue = [];
  for (var cy = 0; cy < rows; cy++) {
    for (var cx = 0; cx < cols; cx++) queue.push([cx, cy]);
  }
  for (var qi = queue.length - 1; qi > 0; qi--) {
    var qj = Math.floor(Math.random() * (qi + 1));
    var tmp = queue[qi]; queue[qi] = queue[qj]; queue[qj] = tmp;
  }
  var placed = 0;
  var MAX_LIVE = 320;

  var spawn = function () {
    if (!stormLayer) return;
    var cell = queue[placed % queue.length];
    placed++;
    var cw = 100 / cols, ch = 100 / rows;
    var jx = (Math.random() * 0.94 + 0.03) * cw;
    var jy = (Math.random() * 0.94 + 0.03) * ch;
    var size = 56 + Math.random() * 52;

    var img = document.createElement('img');
    img.src = src;
    img.alt = '';
    img.style.cssText =
      'position:absolute;width:' + size.toFixed(0) + 'px;height:auto;' +
      'left:' + Math.min(94, Math.max(6, cell[0] * cw + jx)).toFixed(2) + 'vw;' +
      'top:' + Math.min(93, Math.max(7, cell[1] * ch + jy)).toFixed(2) + 'vh;' +
      'padding:7px;background:#FFFFFF;border-radius:12px;' +
      'box-shadow:0 8px 20px -10px rgba(0,0,0,.35);' +
      'transform:translate(-50%,-50%);' +
      'opacity:' + (0.85 + Math.random() * 0.15).toFixed(2) + ';';
    stormLayer.appendChild(img);

    // 一边复制一边慢慢漂移
    var dx1 = (Math.random() * 2 - 1) * 60, dy1 = (Math.random() * 2 - 1) * 60;
    var dx2 = (Math.random() * 2 - 1) * 90, dy2 = (Math.random() * 2 - 1) * 90;
    if (img.animate) {
      img.animate([
        { transform: 'translate(-50%,-50%)' },
        { transform: 'translate(calc(-50% + ' + dx1.toFixed(0) + 'px), calc(-50% + ' + dy1.toFixed(0) + 'px)) rotate(' + ((Math.random() * 2 - 1) * 20).toFixed(0) + 'deg)' },
        { transform: 'translate(calc(-50% + ' + dx2.toFixed(0) + 'px), calc(-50% + ' + dy2.toFixed(0) + 'px)) rotate(' + ((Math.random() * 2 - 1) * 24).toFixed(0) + 'deg)' }
      ], {
        duration: 2600 + Math.random() * 2600,
        iterations: Infinity,
        direction: 'alternate',
        easing: 'ease-in-out'
      });
    }

    if (stormLayer.childElementCount > MAX_LIVE) {
      var old = stormLayer.firstElementChild;
      if (old) stormLayer.removeChild(old);
    }
  };

  for (var s0 = 0; s0 < 30; s0++) spawn();
  stormTimer = setInterval(spawn, 90);
  }

  function stopEgg() {
    clearInterval(chaosTimer);
    chaosTimer = null;
    clearInterval(stormTimer);
    stormTimer = null;
    if (stormLayer) {
      stormLayer.parentNode.removeChild(stormLayer);
      stormLayer = null;
    }
    var body = document.body;
    body.style.transition = 'transform .4s cubic-bezier(.24,.7,.3,1)';
    body.style.transform = 'none';
    body.style.willChange = 'auto';
    var eggStop = document.getElementById('eggStop');
    if (eggStop) eggStop.hidden = true;
  }

  /* ---------- 全局事件委托 ---------- */
  loadSet();
  applySettings();

  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.closest) return;

    if (!rankPanel.hidden && resetMask.hidden && !t.closest('#rankPanel') && !t.closest('#rankBtn')) closeRank();

    var row = t.closest('.rrow');
    if (row) {
      var rn = parseInt(row.getAttribute('data-n'), 10);
      if (!isNaN(rn)) { closeRank(); pickManual(rn); }
      return;
    }

    var cell = t.closest('.cell');
    if (cell) {
      var n = parseInt(cell.getAttribute('data-n'), 10);
      if (!isNaN(n)) pickManual(n);
      return;
    }

    if (t.closest('.logo')) { openAbout(); return; }

    if (t.closest('#setBtn')) { openSettings(); return; }
    var dot = t.closest('.dot[data-color]');
    if (dot) {
      SET.theme = dot.getAttribute('data-color').toLowerCase();
      saveSet();
      applySettings();
      return;
    }
    if (t.closest('#setClose')) { closeSettings(); return; }
    if (t.closest('#eggBtn')) { closeSettings(); startChaos(); return; }
    if (t.closest('#eggStop')) { stopEgg(); return; }
    if (t.closest('#setMinus')) { setCountTo(SET.count - 1); return; }
    if (t.closest('#setPlus')) { setCountTo(SET.count + 1); return; }
    if (t.closest('.sw')) {
      var sw = t.closest('.sw');
      var keyMap = {
        swSound: 'sound', swVoice: 'voice', swGest: 'gest',
        swGrid: 'grid', swRank: 'rank', swRadius: 'radius'
      };
      var k = keyMap[sw.id];
      if (k) { SET[k] = !SET[k]; saveSet(); applySettings(); }
      return;
    }

    if (t.closest('#voiceBtn')) { setVoiceMode(!voiceMode); return; }
    if (t.closest('#gestBtn')) { toggleGesture(); return; }
    if (t.closest('#camBox')) { doSnap(); return; }

    var snd = t.closest('.snd');
    if (snd) {
      soundOn = !soundOn;
      snd.setAttribute('data-on', soundOn ? '1' : '0');
      snd.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
      sndState.textContent = soundOn ? '开' : '关';
      if (!soundOn) {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        readToken++;
        if (showingNumber) afterReading();
      }
      return;
    }

    if (t.closest('#rankBtn')) { toggleRank(); return; }
    if (t.closest('#floatClose')) {
      if (!resetMask.hidden) closeReset();
      else if (!aboutMask.hidden) closeAbout();
      else if (!rankPanel.hidden) closeRank();
      return;
    }
    if (t.closest('#rankReset')) { openReset(); return; }

    if (t.closest('#resetOk')) { resetToday(); return; }

    if (t.closest('.btn')) {
      if (readingLock) return;
      if (state === 'rolling') settle();
      else if (state !== 'settling') startRoll();
      return;
    }

    if (t.closest('#dlgClose')) closeAbout();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!setMask.hidden) { closeSettings(); return; }
      if (!resetMask.hidden) { closeReset(); return; }
      if (!aboutMask.hidden) { closeAbout(); return; }
      if (!rankPanel.hidden) { closeRank(); return; }
    }
    if (e.code !== 'Space' && e.key !== ' ') return;
    var t = e.target;
    if (t && (t.tagName === 'BUTTON' || t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    if (!aboutMask.hidden || !resetMask.hidden || !setMask.hidden) return;
    if (readingLock) return;
    e.preventDefault();
    if (state === 'rolling') settle();
    else if (state !== 'settling') startRoll();
  });

  aboutMask.addEventListener('mousedown', function (e) {
    if (e.target === aboutMask) closeAbout();
  });

  var themeInput = document.getElementById('setTheme');
  if (themeInput) {
    themeInput.addEventListener('input', function () {
      SET.theme = this.value.toLowerCase();
      document.documentElement.style.setProperty('--theme', SET.theme);
      Array.prototype.forEach.call(document.querySelectorAll('.dot[data-color]'), function (d) {
        d.classList.toggle('active', false);
      });
      saveSet();
    });
  }

  var setCountInput = document.getElementById('setCount');
  if (setCountInput) {
    setCountInput.addEventListener('change', function () { setCountTo(this.value); });
    setCountInput.addEventListener('blur', function () { setCountTo(this.value); });
  }

  window.addEventListener('resize', function () {
    if (!floatClose.hidden && floatOwner === 'rank') showFloat(rankBtn, 'rank');
    if (!floatClose.hidden && floatOwner === 'about') showFloat(logoBtn, 'about');
  });

  setMask.addEventListener('mousedown', function (e) {
    if (e.target === setMask) closeSettings();
  });

  resetMask.addEventListener('mousedown', function (e) {
    if (e.target === resetMask) closeReset();
  });


  /* ---------- 初始状态：中间先显示提示 ---------- */
  setTip(0, false);
  startTipLoop();
</script>
<button class="egg-stop" id="eggStop" type="button" hidden>我错了</button>

</body>
</html>
