<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>班级学生点名</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2312120F'/%3E%3Crect x='14' y='12' width='7' height='40' fill='%23FFFFFF' transform='rotate(-8 17 32)'/%3E%3Crect x='29' y='10' width='7' height='44' fill='%23FFFFFF' transform='rotate(-8 32 32)'/%3E%3Crect x='44' y='14' width='7' height='38' fill='%23FFFFFF' transform='rotate(-8 47 32)'/%3E%3C/svg%3E">
<style>
  :root{
    color-scheme:light dark;
    --paper:#FFFFFF;
    --ink:#12120F;
    --line:#E1DFD6;
    --muted:#6E6C64;
    --theme:#C43C22;
    --accent:var(--theme);
    --surface:#FFFFFF;
    --line-soft:var(--line-soft);
    --hover:#F6F5F0;
    --press:#E8E6DD;
    --dim:#C4C1B6;
    --ink-hover:#2B2B25;
    --on-ink:#FFFFFF;
    --deep:#7C2417;
    --shc:18,18,15;
    --r:14px;
    --r-sm:9px;
  }

  @media (prefers-color-scheme: dark){
    :root{
      --paper:#111110;
      --surface:#1A1A17;
      --ink:#F3F1E9;
      --line:#3C3B33;
      --line-soft:#272722;
      --hover:#22221D;
      --press:#2B2B25;
      --dim:#57554B;
      --ink-hover:#DFDBCD;
      --on-ink:#151513;
      --deep:#7A2318;
      --muted:#9B998E;
      --accent:color-mix(in srgb,var(--theme) 80%,#FFFFFF 20%);
      --shc:0,0,0;
    }
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;}

  body{
    background:var(--paper);
    color:var(--ink);
    font-family:"HarmonyOS Sans SC","HarmonyOS Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }

  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:18px 20px 8px;
    max-width:1040px;
    width:100%;
    margin:0 auto;
  }

  .logo{
    appearance:none;
    width:52px;
    height:52px;
    flex:none;
    padding:0;
    background:var(--surface);
    border:0;
    border-radius:var(--r);
    overflow:hidden;
    cursor:pointer;
    line-height:0;
  }
  .logo img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;}
  .logo:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

  .hud{
    display:flex;
    align-items:center;
    gap:16px;
    font-size:13px;
    color:var(--muted);
    letter-spacing:.02em;
  }
  .hud .count{white-space:nowrap;}
  .hud .count b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;}

  .snd{
    appearance:none;
    background:transparent;
    border:0;
    border-bottom:1px solid var(--line);
    color:var(--muted);
    font:inherit;
    font-size:13px;
    padding:8px 2px;
    min-height:44px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
  }
  .snd:hover{color:var(--accent);border-color:var(--accent);}
  #gestBtn:hover{background:var(--surface);border-color:var(--accent);color:var(--accent);}
  .snd:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  .snd svg{width:15px;height:15px;display:block;}
  .snd .st{font-variant-numeric:tabular-nums;}
  .snd[data-on="0"] .wave{opacity:.25;}

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:28px;
    padding:16px 20px 56px;
    min-height:0;
  }

  .stage{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    min-height:clamp(180px,32vh,320px);
  }

  .numwrap{
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:.04em;
    line-height:.92;
  }
  .numwrap[hidden]{display:none;}

  .num{
    font-size:clamp(112px,31vw,252px);
    font-weight:700;
    letter-spacing:-.045em;
    font-variant-numeric:tabular-nums;
    font-feature-settings:"tnum" 1;
    min-width:2.1ch;
    text-align:center;
    display:inline-block;
  }
  .num.dim{color:var(--dim);font-weight:600;}

  .unit{
    font-size:clamp(20px,5vw,30px);
    font-weight:400;
    color:var(--muted);
    letter-spacing:.14em;
    padding-bottom:.14em;
    transition:opacity .15s ease;
  }
  .unit.off{opacity:0;}

  .num.fly-out{
    animation:numFlyOut .42s cubic-bezier(.32,.72,.36,1) forwards;
    transform-origin:50% 55%;
    will-change:transform,filter,opacity;
  }
  @keyframes numFlyOut{
    0%{transform:translateY(0) rotate(0) scale(1);filter:blur(0);opacity:1;}
    30%{transform:translateY(-16%) rotate(-7deg) scale(1.03);filter:blur(2px);opacity:.92;}
    100%{transform:translateY(-64%) rotate(-18deg) scale(.8);filter:blur(16px);opacity:0;}
  }

  .num.rise-in{
    animation:numRiseIn .78s cubic-bezier(.24,.7,.3,1) both;
    transform-origin:50% 60%;
    will-change:transform,filter,opacity;
  }
  @keyframes numRiseIn{
    0%{transform:translateY(52%) scale(.84);filter:blur(18px);opacity:0;}
    46%{transform:translateY(-8%) scale(1.05);filter:blur(3px);opacity:1;}
    60%{transform:translateY(1%) scale(.985);filter:blur(0);}
    72%{transform:translateY(-5%) scale(1.018);}
    84%{transform:translateY(0) scale(.995);}
    93%{transform:translateY(-2%) scale(1.006);}
    100%{transform:translateY(0) scale(1);filter:blur(0);opacity:1;}
  }

  .tipwrap{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    padding:0 4px;
    text-align:center;
  }
  .tipwrap[hidden]{display:none;}

  .tip{
    display:inline-block;
    max-width:min(30em,86vw);
    font-size:clamp(13px,1.7vw,16px);
    line-height:1.75;
    font-weight:400;
    letter-spacing:.02em;
    color:var(--muted);
    transform-origin:50% 60%;
    will-change:transform,filter,opacity;
  }
  .tip.fly-out{animation:tipOut .4s cubic-bezier(.32,.72,.36,1) forwards;}
  .tip.rise-in{animation:tipIn .7s cubic-bezier(.24,.7,.3,1) both;}

  @keyframes tipOut{
    0%{transform:translateY(0) rotate(0);filter:blur(0);opacity:1;}
    100%{transform:translateY(-1.5em) rotate(-3deg);filter:blur(8px);opacity:0;}
  }
  @keyframes tipIn{
    0%{transform:translateY(1.5em) scale(.96);filter:blur(10px);opacity:0;}
    55%{transform:translateY(-.1em) scale(1.012);filter:blur(1px);opacity:1;}
    72%{transform:translateY(.04em) scale(.998);filter:blur(0);}
    88%{transform:translateY(-.06em) scale(1.004);}
    100%{transform:translateY(0) scale(1);filter:blur(0);opacity:1;}
  }

  .btn{
    appearance:none;
    border:1px solid var(--ink);
    background:var(--ink);
    color:var(--on-ink);
    font:inherit;
    font-size:16px;
    font-weight:600;
    letter-spacing:.22em;
    height:58px;
    min-width:min(248px,72vw);
    padding:0 .22em;
    border-radius:var(--r);
    cursor:pointer;
  }
  .btn:hover{background:var(--ink-hover);}
  .btn[data-mode="read"]{pointer-events:none;cursor:default;}
  .btn[data-mode="stop"]{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn[data-mode="stop"]:hover{background:#AC3018;}
  .btn:disabled{background:#8E8B80;border-color:#8E8B80;color:#fff;cursor:default;}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}

  .hint{
    margin:0;
    font-size:13px;
    color:var(--muted);
    letter-spacing:.03em;
    text-align:center;
  }
  .hint kbd{
    font:inherit;
    border:1px solid var(--line);
    border-bottom-width:2px;
    padding:1px 6px;
    border-radius:6px;
    color:var(--ink);
  }

  .cam{
    position:fixed;
    left:14px;
    bottom:14px;
    z-index:22;
    width:148px;
    background:#0F0F0D;
    border:1px solid var(--line);
    border-radius:var(--r);
    overflow:hidden;
    display:none;
  }
  .cam.on{display:block;}
  .cam video{
    display:block;
    width:100%;
    height:112px;
    object-fit:cover;
    transform:scaleX(-1);
    background:#0F0F0D;
  }
  .cam-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:6px;
    padding:5px 7px;
    font-size:11px;
    letter-spacing:.04em;
    color:#E9E7DF;
    border-top:1px solid rgba(255,255,255,.12);
  }
  .cam-bar span:last-child{color:#fff;font-variant-numeric:tabular-nums;}
  #camSnap{
    display:none;
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:112px;
    background:#0F0F0D;
  }
  .cam.snap #camSnap{display:block;}

  /* ===== 今日点名排行 ===== */
  .rankBtn{
    position:fixed;
    right:14px;
    bottom:14px;
    z-index:24;
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--surface);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:var(--r);
    cursor:pointer;
    font-size:13px;
    line-height:1;
  }
  .rankBtn:hover{background:var(--surface);border-color:var(--accent);color:var(--accent);}
  .rankBtn[aria-expanded="true"]{background:var(--surface);border-color:var(--accent);color:var(--accent);}
  .rankBtn[aria-expanded="true"]:hover{background:var(--surface);border-color:var(--accent);color:var(--accent);}
  .rankBtn .rankArrow{display:block;transition:transform .2s cubic-bezier(.24,.7,.3,1);}
  .rankBtn[aria-expanded="true"] .rankArrow{transform:rotate(180deg);}

  .rankPanel{
    position:fixed;
    right:14px;
    bottom:74px;
    z-index:23;
    width:min(320px,calc(100vw - 28px));
    max-height:min(66vh,520px);
    overflow:auto;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--r);
    box-shadow:0 1px 3px rgba(var(--shc),.05),0 14px 30px -12px rgba(var(--shc),.22);
  }
  .rankPanel[hidden]{display:none;}
  @keyframes rankUp{
    from{opacity:0;transform:translateY(14px);}
    to{opacity:1;transform:translateY(0);}
  }
  .rankHead{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:12px 14px;
    border-bottom:1px solid var(--line);
    font-size:13px;
    letter-spacing:.02em;
  }
  .rankDate{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;}
  .rankDate{margin-left:auto;}
  .rankReset{
    padding:3px 9px;
    font:inherit;
    font-size:12px;
    color:var(--muted);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--r-sm);
    cursor:pointer;
    transition:color .16s cubic-bezier(.24,.7,.3,1),
               background-color .16s cubic-bezier(.24,.7,.3,1),
               border-color .16s cubic-bezier(.24,.7,.3,1);
  }
  .rankReset:hover{color:var(--ink);border-color:var(--ink);}

  .floatClose{
    position:fixed;
    z-index:40;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
    background:var(--surface);
    color:var(--ink);
    border:1px solid var(--line);
    border-radius:var(--r);
    font:inherit;
    font-size:22px;
    line-height:1;
    cursor:pointer;
    box-shadow:
      0 1px 3px rgba(var(--shc),.07),
      0 10px 24px -10px rgba(var(--shc),.22);
    transition:color .16s cubic-bezier(.24,.7,.3,1),
               border-color .16s cubic-bezier(.24,.7,.3,1);
  }
  .floatClose:hover{color:var(--accent);border-color:var(--accent);}
  .floatClose:active{transform:scale(.96);}
  .floatClose[hidden]{display:none;}

  .rankClose{
    appearance:none;
    background:transparent;
    border:0;
    padding:2px 4px;
    min-width:30px;
    font:inherit;
    font-size:20px;
    line-height:1;
    color:var(--ink);
    cursor:pointer;
  }
  .rankClose:hover{color:var(--accent);}

  .reset-sheet{width:min(360px,100%);}
  .reset-sheet .sheet-close{
    font-size:24px;
    line-height:1;
    min-height:48px;
    min-width:40px;
    padding:6px 6px 8px;
    color:var(--ink);
  }
  .reset-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
    padding:20px 20px 8px;
  }
  .reset-body{
    margin:0;
    padding:0 20px 18px;
    font-size:14px;
    line-height:1.7;
    color:var(--muted);
  }
  .reset-ok{
    display:block;
    width:100%;
    min-height:52px;
    font:inherit;
    font-size:15px;
    color:var(--ink);
    background:var(--surface);
    border:0;
    border-top:1px solid var(--line);
    border-radius:0 0 var(--r) var(--r);
    cursor:pointer;
    transition:background-color .18s cubic-bezier(.24,.7,.3,1),
               color .18s cubic-bezier(.24,.7,.3,1);
  }
  .reset-ok:hover{background:#2F7D4F;color:#fff;}
  .reset-ok:focus-visible{outline:none;background:#2F7D4F;color:#fff;}
  .reset-ok:active{background:#276A43;color:#fff;}

  .rankTree{padding:6px 0 10px;}
  .rrow{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    padding:9px 14px;
    font:inherit;
    font-size:13px;
    color:inherit;
    background:none;
    border:0;
    border-bottom:1px solid var(--line-soft);
    text-align:left;
    cursor:pointer;
  }
  .rrow:hover{background:var(--hover);}
  .rrow:last-child{border-bottom:0;}
  .rrow.zero{color:var(--muted);}
  .lrank{color:var(--muted);font-size:11px;width:26px;font-variant-numeric:tabular-nums;}
  .ln{font-weight:600;font-variant-numeric:tabular-nums;min-width:1.9em;}
  .lc{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);}
  .rrow.zero .lc{color:var(--dim);}

  @media (max-width:520px){
    .rankPanel{width:calc(100vw - 28px);}
    .hud{gap:10px;font-size:12px;flex-wrap:wrap;justify-content:flex-end;}
    .dlg .set-row{padding:0 14px;}
    .dlg .set-cap,.dlg .set-note{padding-left:14px;padding-right:14px;}
  }

  /* ===== 学号格 ===== */
  .all{
    max-width:1040px;
    width:100%;
    margin:0 auto;
    padding:0 20px 34px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    border-top:1px solid var(--line);
    border-left:1px solid var(--line);
    border-radius:var(--r);
    overflow:hidden;
  }

  .cell{
    appearance:none;
    background:transparent;
    border:0;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    border-radius:0;
    font:inherit;
    min-height:44px;
    padding:9px 0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13.5px;
    color:var(--muted);
    font-variant-numeric:tabular-nums;
    letter-spacing:.03em;
    cursor:pointer;
  }
  .cell:hover{color:var(--ink);background:#F2F1EC;}
  .cell:active{background:var(--press);}
  .cell:focus-visible{outline:2px solid var(--accent);outline-offset:-3px;color:var(--ink);}
  .cell.on{background:var(--accent);color:#fff;font-weight:600;}
  .cell.on:hover{background:color-mix(in srgb,var(--accent) 84%,#000);color:#fff;}

  /* ===== 关于：自定义浮层 ===== */
  .mask{
    position:fixed;
    inset:0;
    z-index:30;
    background:transparent;
    display:block;
    padding:0;
  }
  .mask[hidden]{display:none;}

  .sheet{
    background:var(--surface);
    color:var(--ink);
    border:0;
    border-radius:var(--r);
    position:fixed;
    width:min(420px,100%);
    margin:0;
    max-height:calc(100vh - 32px);
    overflow:auto;
    box-shadow:
      0 0 0 1px rgba(var(--shc),.05),
      0 1px 3px rgba(var(--shc),.05),
      0 12px 28px -10px rgba(var(--shc),.18),
      0 40px 80px -26px rgba(var(--shc),.26);
    transform-origin:50% 60%;
    will-change:transform,filter,opacity;
  }

  .sheet-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    border-bottom:1px solid var(--line);
  }
  .sheet-head h3{
    margin:0;
    font-size:13px;
    font-weight:600;
    letter-spacing:.16em;
  }
  .sheet-close{
    appearance:none;
    background:transparent;
    border:0;
    color:var(--muted);
    font:inherit;
    font-size:13px;
    padding:8px 4px;
    min-height:44px;
    cursor:pointer;
    letter-spacing:.06em;
  }
  .sheet-close:hover{color:var(--ink);}
  .sheet-close:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .sheet-body{padding:22px 16px 20px;}
  .sheet-body p{margin:0;font-size:15px;line-height:1.85;letter-spacing:.01em;}


  /* ===== 设置 ===== */
  .mask.dim{
    background:rgba(var(--shc),.34);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
  }
  .dlg{
    background:var(--surface);
    color:var(--ink);
    border-radius:var(--r);
    width:min(440px,100%);
    max-height:calc(100vh - 36px);
    overflow:auto;
    box-shadow:
      0 0 0 1px rgba(var(--shc),.05),
      0 2px 6px rgba(var(--shc),.06),
      0 18px 40px -14px rgba(var(--shc),.24),
      0 48px 90px -34px rgba(var(--shc),.3);
  }
  .dlg[hidden]{display:none;}
  .mask.dim[hidden]{display:none;}
  .dlg-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 18px 14px;
    border-bottom:1px solid var(--line);
  }
  .dlg-head h3{margin:0;font-size:15px;font-weight:600;letter-spacing:.04em;}
  .dlg-x{
    appearance:none;
    background:transparent;
    border:0;
    padding:2px 4px;
    min-width:34px;
    font:inherit;
    font-size:22px;
    line-height:1;
    color:var(--ink);
    cursor:pointer;
  }
  .dlg-x:hover{color:var(--accent);}
  .dlg-body{padding:4px 0 14px;}
  .set-cap{
    padding:14px 18px 8px;
    font-size:12px;
    color:var(--muted);
    letter-spacing:.08em;
  }
  .set-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    min-height:50px;
    padding:0 18px;
    border-top:1px solid var(--line-soft);
    font-size:14px;
  }
  .set-row:last-child{border-bottom:1px solid var(--line-soft);}
  .set-note{
    margin:0;
    padding:8px 18px 2px;
    font-size:12px;
    line-height:1.6;
    color:var(--muted);
  }
  .stepper{display:flex;align-items:center;gap:8px;}
  .stepper button{
    width:32px;
    height:32px;
    padding:0;
    font:inherit;
    font-size:16px;
    line-height:1;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--r-sm);
    cursor:pointer;
  }
  .stepper button:hover{border-color:var(--ink);}
  .stepper button:active{transform:scale(.96);}
  .stepper input{
    width:62px;
    height:32px;
    padding:0 4px;
    font:inherit;
    font-size:14px;
    text-align:center;
    color:var(--ink);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--r-sm);
    font-variant-numeric:tabular-nums;
    -moz-appearance:textfield;
  }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .sw{
    position:relative;
    flex:none;
    width:46px;
    height:26px;
    padding:0;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:999px;
    cursor:pointer;
    transition:background-color .18s cubic-bezier(.24,.7,.3,1),
               border-color .18s cubic-bezier(.24,.7,.3,1);
  }
  .sw i{
    position:absolute;
    left:3px;
    top:3px;
    width:18px;
    height:18px;
    border-radius:999px;
    background:var(--muted);
    transition:transform .2s cubic-bezier(.2,.9,.3,1),
               background-color .18s cubic-bezier(.24,.7,.3,1);
  }
  .swatches{display:flex;align-items:center;gap:8px;}
  .dot{
    width:26px;
    height:26px;
    padding:0;
    border:1px solid rgba(var(--shc),.12);
    border-radius:999px;
    cursor:pointer;
    background:var(--c);
    box-shadow:0 0 0 0 transparent;
    transition:box-shadow .16s cubic-bezier(.24,.7,.3,1),transform .16s cubic-bezier(.24,.7,.3,1);
  }
  .dot:hover{transform:translateY(-1px);}
  .dot.active{box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--ink);}
  .dot-pick{
    position:relative;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:conic-gradient(from 90deg,#C43C22,#2F5D8A,#2F7D4F,#8A6A2F,#C43C22);
  }
  .dot-pick input{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    padding:0;
    border:0;
    opacity:0;
    cursor:pointer;
  }
  .dot-pick::after{
    content:"";
    position:absolute;
    inset:4px;
    border-radius:999px;
    background:var(--surface);
    opacity:.62;
    pointer-events:none;
  }
  .sw[data-on="1"]{background:var(--ink);border-color:var(--ink);}
  .sw[data-on="1"] i{transform:translateX(20px);background:var(--surface);}

  @media (prefers-color-scheme: dark){
    .rankBtn:hover,#gestBtn:hover{background:var(--surface);border-color:var(--accent);color:var(--accent);}
    .btn:disabled{background:#3A3931;border-color:#3A3931;color:#8E8C80;}
    .mask.dim{background:rgba(0,0,0,.62);}
    .rankPanel,.sheet,.dlg{box-shadow:0 0 0 1px var(--line),0 22px 52px -18px rgba(0,0,0,.85);}
    .logo{background:transparent;}
    .logo img{filter:invert(1);mix-blend-mode:screen;}
    .cam{border-color:var(--line);}
    .sw[data-on="1"]{background:var(--accent);border-color:var(--accent);}
    .sw[data-on="1"] i{background:#FFFDF6;}
    .grid{background:var(--surface);}
    .rrow:hover{background:var(--hover);}
  }

  /* ===== 统一按钮手感 + 浮层动效 ===== */
  .logo,
  .snd,
  .btn,
  .cell,
  .sheet-close{
    transition:transform .16s cubic-bezier(.24,.7,.3,1),
               background-color .16s cubic-bezier(.24,.7,.3,1),
               color .16s cubic-bezier(.24,.7,.3,1),
               border-color .16s cubic-bezier(.24,.7,.3,1);
  }
  .logo:hover,
  .snd:hover,
  .btn:hover,
  .cell:hover,
  .sheet-close:hover{transform:translateY(-1px);}
  .logo:active,
  .snd:active,
  .btn:active,
  .cell:active,
  .sheet-close:active{transform:translateY(1px) scale(.975);}
  .btn:disabled,
  .btn:disabled:active{transform:none;}

  .mask:not([hidden]){animation:none;}
  .mask.is-closing{animation:none;}
  .sheet,.rankPanel{transform-origin:50% 50%;}

  @keyframes maskIn{from{opacity:0;}to{opacity:1;}}
  @keyframes maskOut{from{opacity:1;}to{opacity:0;}}
  @keyframes sheetIn{
    0%{opacity:0;transform:translateY(30px) scale(.94);filter:blur(14px);}
    55%{opacity:1;transform:translateY(-6px) scale(1.012);filter:blur(2px);}
    72%{transform:translateY(2px) scale(.998);filter:blur(0);}
    86%{transform:translateY(-3px) scale(1.004);}
    100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0);}
  }
  @keyframes sheetOut{
    0%{opacity:1;transform:translateY(0) scale(1) rotate(0);filter:blur(0);}
    28%{opacity:.95;transform:translateY(-10px) scale(1.012) rotate(-.8deg);filter:blur(2px);}
    100%{opacity:0;transform:translateY(-64px) scale(.9) rotate(-2.4deg);filter:blur(14px);}
  }

  @media (min-width:640px){
    header{padding:24px 28px 8px;}
    .logo{width:58px;height:58px;}
    .hud{font-size:14px;gap:20px;}
    .snd{font-size:14px;}
    main{gap:34px;padding:24px 28px 64px;}
  }

  /* ===== 手机端（鸿蒙等窄屏） ===== */
  @media (max-width:599px){
    body{
      overscroll-behavior-y:none;
      -webkit-text-size-adjust:100%;
    }
    header{
      padding:calc(10px + env(safe-area-inset-top)) 16px 0;
      gap:10px;
      align-items:flex-start;
    }
    .logo{width:44px;height:44px;}
    .hud{
      flex:1;
      min-width:0;
      justify-content:flex-end;
      align-items:center;
      gap:12px;
      font-size:11.5px;
      flex-wrap:nowrap;
    }
    .hud .count{display:none;}
    .ver{display:none;}
    .snd{
      min-height:44px;
      padding:6px 0;
      font-size:11.5px;
      gap:4px;
    }
    .snd .st{font-size:10.5px;}
    .snd svg{width:14px;height:14px;}

    main{
      gap:14px;
      padding:6px 16px 14px;
      justify-content:center;
    }
    .stage{min-height:clamp(140px,26vh,240px);}
    .num{font-size:clamp(92px,27vw,168px);}
    .unit{font-size:clamp(16px,4.4vw,24px);}
    .tip{font-size:13px;line-height:1.6;max-width:88vw;}

    .btn{
      width:100%;
      min-width:0;
      height:52px;
      font-size:15px;
      letter-spacing:.16em;
    }

    .all{
      padding:0 16px calc(18px + env(safe-area-inset-bottom));
    }
    .grid{
      grid-template-columns:repeat(6,1fr);
    }
    .cell{
      min-height:46px;
      font-size:13px;
      padding:0;
    }

    .rankBtn{
      right:calc(14px + env(safe-area-inset-right));
      bottom:calc(14px + env(safe-area-inset-bottom));
      width:46px;
      height:46px;
    }
    .rankPanel{
      left:calc(14px + env(safe-area-inset-left));
      right:calc(14px + env(safe-area-inset-right));
      width:auto;
      bottom:calc(70px + env(safe-area-inset-bottom));
      max-height:64vh;
    }

    .mask.dim{padding:14px;}
    .dlg{
      width:100%;
      max-height:calc(100vh - 28px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    }
    .dlg-head{padding:14px 16px 12px;}
    .set-row{min-height:52px;padding:0 16px;}
    .set-cap,.set-note{padding-left:16px;padding-right:16px;}
    .set-cap{padding-top:12px;}

    .sheet{
      width:calc(100vw - 24px);
      max-height:calc(100vh - 24px - env(safe-area-inset-top));
    }
  }

  @media (max-width:380px){
    .hud{gap:8px;}
    .snd{font-size:11px;gap:3px;}
    .snd .st{display:none;}
    .num{font-size:clamp(84px,26vw,140px);}
  }

  @media (max-height:520px) and (orientation:landscape){
    header{padding-top:calc(8px + env(safe-area-inset-top));}
    .logo{width:38px;height:38px;}
    main{flex-direction:row;justify-content:center;gap:20px;padding:0 16px 10px;}
    .stage{flex:1;min-height:0;}
    .num{font-size:clamp(64px,14vh,120px);}
    .btn{width:auto;min-width:180px;height:48px;}
    .all{padding-bottom:calc(12px + env(safe-area-inset-bottom));}
    .cell{min-height:38px;}
  }


  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important;}
  }
</style>
</head>

<script>

    !window.matchMedia('(hover: hover)').matches);

  var rollTimer = null;
  var soundOn = true;
  var zhVoice = null;
  var voiceChecked = false;
  var talking = null;
  var lastPicked = null;
  var showingNumber = false;   // 中间现在显示的是号码
  var readEnding = false;      // 当前这一轮已经进入收尾
  var areaToken = 0;           // 号码区 / 提示区的切换令牌
  var animToken = 0;
  var readToken = 0;
  var readFallback = null;
  var voiceMode = false;
  var rec = null;
  var recRunning = false;
  var recShouldRun = false;
  var recRestartTimer = null;
  var recIgnore = false;
  var recGuardTimer = null;
  var lastReadNumber = null;
  var dedupeUntil = 0;

  /* ---------- 学号格 ---------- */
  var cells = {};

  function buildGrid() {
    gridEl.innerHTML = '';
    cells = {};
    ALL.forEach(function (n) {
      var c = document.createElement('button');
      c.type = 'button';
      c.className = 'cell';
      c.textContent = n;
      c.setAttribute('data-n', n);
      c.setAttribute('aria-label', '请' + n + '号上台');
      cells[n] = c;
      gridEl.appendChild(c);
    });
  }

  buildGrid();

  var hlTimer = 0;
  function clearHighlight() {
    clearTimeout(hlTimer);
    hlTimer = setTimeout(function () {
      if (lastPicked !== null && cells[lastPicked]) cells[lastPicked].classList.remove('on');
      lastPicked = null;
    }, 220);
  }

  function highlight(n) {
    if (lastPicked !== null && cells[lastPicked]) cells[lastPicked].classList.remove('on');
    if (n !== null && cells[n]) cells[n].classList.add('on');
    lastPicked = n;
  }

    '科技改变生活！',
    '你可以点上面的按钮试试！',
    '：）'

    var text = TIPS[i];
    clearTimeout(tipSwapTimer);
    if (!animate || reduceMotion()) {
      tipText.textContent = text;
      return;
    }
    tipText.classList.remove('rise-in');
    tipText.classList.add('fly-out');
    tipSwapTimer = setTimeout(function () {
      tipText.textContent = text;
      tipText.classList.remove('fly-out');
      void tipText.offsetWidth;
      tipText.classList.add('rise-in');
      tipSwapTimer = setTimeout(function () {
        tipText.classList.remove('rise-in');
      }, 760);
    }, 360);
  }

  function startTipLoop() {
    if (tipTimer) return;
    tipTimer = setInterval(function () {
      tipIdx = (tipIdx + 1) % TIPS.length;
      setTip(tipIdx, true);
    }, 5000);
  }

  function stopTipLoop() {
    clearInterval(tipTimer);
    tipTimer = null;
  }

  /* ---------- 中间区域切换 ---------- */
  function enterNumberMode() {
    stopTipLoop();
    readEnding = false;
    areaToken++;
    tipWrap.hidden = true;
    numWrap.hidden = false;
  }

  function backToTips(animate) {
    endReading();
    showingNumber = false;
    readEnding = false;
    numEl.classList.remove('fly-out', 'rise-in');
    numWrap.hidden = true;
    tipWrap.hidden = false;

    if (animate && !reduceMotion()) {
      tipText.classList.remove('rise-in');
      void tipText.offsetWidth;
      tipText.classList.add('rise-in');
      setTimeout(function () { tipText.classList.remove('rise-in'); }, 760);
    }
    startTipLoop();
    unmuteRec();
  }

  /* ---------- 朗读 ---------- */
  function reduceMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function pickZhVoice() {
    if (voiceChecked) return zhVoice;
    if (!('speechSynthesis' in window)) return null;
    var vs = window.speechSynthesis.getVoices() || [];
    var zh = vs.filter(function (v) { return /^zh/i.test(v.lang); });
    if (zh.length) {
      zhVoice = zh.filter(function (v) { return v.localService; })[0] || zh[0];
      voiceChecked = true;
    }
    return zhVoice;
  }

  if ('speechSynthesis' in window) {
    try {
      window.speechSynthesis.addEventListener('voiceschanged', function () {
        voiceChecked = false;
        pickZhVoice();
      });
    } catch (e) {}
  }

  var DIGITS = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
  function cnNum(n) {
    if (n < 10) return DIGITS[n];
    if (n < 20) return '十' + (n % 10 ? DIGITS[n % 10] : '');
    var t = Math.floor(n / 10), o = n % 10;
    return DIGITS[t] + '十' + (o ? DIGITS[o] : '');
  }

  function speakNumber(n, onDone) {
    var token = ++readToken;
    var finished = false;

    function finish() {
      if (finished || token !== readToken) return;
      finished = true;
      clearTimeout(readFallback);
      if (onDone) onDone();
    }

    if (!soundOn || !('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
      readFallback = setTimeout(finish, 550);
      return;
    }

    var synth = window.speechSynthesis;
    try {
      synth.cancel();
      var u = new SpeechSynthesisUtterance('请' + cnNum(n) + '号上台');
      u.lang = 'zh-CN';
      u.rate = 0.95;
      u.pitch = 1;
      u.volume = 1;
      var v = pickZhVoice();
      if (v) u.voice = v;
      u.onend = function () {
        if (talking === u) talking = null;
        finish();
      };
      u.onerror = function () {
        if (talking === u) talking = null;
        finish();
      };
      talking = u;
      readFallback = setTimeout(finish, 9000);
      setTimeout(function () {
        if (synth.paused) synth.resume();
        synth.speak(u);
      }, 150);
    } catch (e) {
      readFallback = setTimeout(finish, 550);
    }
  }

  /* ---------- 语音操控 ---------- */
  var REC = window.SpeechRecognition || window.webkitSpeechRecognition;

  function initRec() {
    if (rec || !REC) return rec;
    rec = new REC();
    rec.lang = 'zh-CN';
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 3;

    var interimTimer = null;
    var interimCandidate = 0;

    function fireNumber(n) {
      clearTimeout(interimTimer);
      interimCandidate = 0;
      var now = Date.now();
      // 刚念过的号在冷却期内的重复识别一律丢掉，防止把自己的声音当成新指令反复循环
      if (n === lastReadNumber && now < dedupeUntil) return;
      lastReadNumber = n;
      dedupeUntil = now + 2200;
      onVoiceNumber(n);
    }

    rec.onresult = function (e) {
      if (recIgnore) return;

      var finalText = '';
      var interimText = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var r = e.results[i];
        var tr = r[0] && r[0].transcript ? r[0].transcript : '';
        if (r.isFinal) finalText += tr;
        else interimText += tr;
      }

      var heard = finalText || interimText;
      if (!heard) return;

      if (G.on && (heard.indexOf('截图') >= 0 || heard.indexOf('截屏') >= 0 || heard.indexOf('拍照') >= 0)) {
        if (finalText) { clearTimeout(interimTimer); doSnap(); }
        return;
      }
      if (!voiceMode) return;

      var n = parseSpoken(heard);
      if (!n || ALL.indexOf(n) === -1) {
        interimCandidate = 0;
        clearTimeout(interimTimer);
        return;
      }

      if (finalText) { fireNumber(n); return; }

      var hasUnit = /号/.test(heard);
      if (n !== interimCandidate) {
        interimCandidate = n;
        clearTimeout(interimTimer);
        interimTimer = setTimeout(function () { fireNumber(n); }, hasUnit ? 90 : 420);
      } else if (hasUnit && !interimTimer) {
        interimTimer = setTimeout(function () { fireNumber(n); }, 90);
      }
    };

    rec.onerror = function (e) {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        setVoiceMode(false);
        voiceState.textContent = '无权限';
      }
    };

    rec.onend = function () {
      recRunning = false;
      if (voiceMode && recShouldRun && !recIgnore) {
        clearTimeout(recRestartTimer);
        recRestartTimer = setTimeout(startListening, 150);
      }
    };
    return rec;
  }

  function startListening() {
    if (!voiceMode || !rec || recRunning || !recShouldRun) return;
    try {
      rec.start();
      recRunning = true;
    } catch (e) {
      recRunning = false;
    }
  }

  function stopListening() {
    recShouldRun = false;
    recIgnore = false;
    clearTimeout(recRestartTimer);
    clearTimeout(recGuardTimer);
    if (!rec) return;
    try { rec.abort(); } catch (e) {}
    recRunning = false;
  }

  function resumeListening() {
    if (!voiceMode || !rec) return;
    recShouldRun = true;
    startListening();
  }

  /* 朗读期间不关麦克风，只是暂时忽略识别结果（避免重开麦克风时反复求授权） */
  function muteRec() {
    recIgnore = true;
    clearTimeout(recGuardTimer);
  }

  function unmuteRec() {
    clearTimeout(recGuardTimer);
    if (!voiceMode) { recIgnore = false; return; }
    dedupeUntil = Math.max(dedupeUntil, Date.now() + 2200);
    recGuardTimer = setTimeout(function () { recIgnore = false; }, 600);
    resumeListening();
  }

  function onVoiceNumber(n) {
    muteRec();
    pickManual(n);
  }

  function updateHint() {
    if (!hintText) return;
    if (voiceMode) {
      hintText.innerHTML = '语音模式：说「五十一号」就会念出来';
      return;
    }
    hintText.innerHTML = inputTouch
      ? '点按钮开始、停止 · 点学号直接念'
      : '按 <kbd>空格</kbd> 开始、停止';
  }

  function setInputTouch(on) {
    if (on === inputTouch) return;
    inputTouch = on;
    updateHint();
  }

  document.addEventListener('pointerdown', function (e) {
    var t = e.pointerType;
    if (t === 'touch' || t === 'pen') setInputTouch(true);
    else if (t === 'mouse') setInputTouch(false);
  }, true);

  document.addEventListener('touchstart', function () { setInputTouch(true); }, { passive: true, capture: true });

  document.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.code === 'Space') setInputTouch(false);
  }, true);

  function setVoiceMode(on) {
    voiceMode = on;
    if (voiceBtn) {
      voiceBtn.setAttribute('data-on', on ? '1' : '0');
      voiceBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
      voiceState.textContent = on ? '听' : '关';
    }
    updateHint();

    if (!on) { stopListening(); if (G.on) startSnapListen(); return; }
    stopSnapListen();
    if (!REC) {
      voiceState.textContent = '不支持';
      voiceMode = false;
      return;
    }
    initRec();
    recShouldRun = true;
    startListening();
  }

  function cn2num(str) {
    var map = { 零: 0, 〇: 0, 一: 1, 壹: 1, 二: 2, 两: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
    var s = str.replace(/[零〇]/g, '零').replace(/两/g, '二').replace(/壹/g, '一');
    if (/^[0-9]+$/.test(s)) return parseInt(s, 10);
    var m = s.match(/^([一二三四五六七八九])?十([一二三四五六七八九])?$/);
    if (m) return (m[1] ? map[m[1]] : 1) * 10 + (m[2] ? map[m[2]] : 0);
    if (s.length === 1 && typeof map[s] === 'number') return map[s];
    return NaN;
  }

  function parseSpoken(text) {
    var t = String(text || '').replace(/\s/g, '').replace(/[，。、！？,.!?]/g, '');
    var d = t.match(/([0-9]{1,2})/);
    if (d) {
      var a = parseInt(d[1], 10);
      if (a >= 1 && a <= 51) return a;
    }
    var c = t.match(/([一二三四五六七八九两壹]?十[一二三四五六七八九零]?|[一二三四五六七八九两壹])\s*号?/);
    if (c) {
      var b = cn2num(c[1]);
      if (!isNaN(b)) return b;
    }
    return NaN;
  }

  /* ---------- 换号动画 ---------- */
  function swapNumber(n, onSwapped) {
    var token = ++animToken;
    var hasOld = showingNumber;

    numEl.classList.remove('fly-out', 'rise-in');
    void numEl.offsetWidth;

    function putIn() {
      if (token !== animToken) return;
      show(n, false);
      showingNumber = true;
      numEl.classList.remove('fly-out');
      void numEl.offsetWidth;
      numEl.classList.add('rise-in');
      if (onSwapped) onSwapped();
      setTimeout(function () {
        if (token === animToken) numEl.classList.remove('rise-in');
      }, 900);
    }

    if (!hasOld || reduceMotion()) { putIn(); return; }

    var done = false;
    function outEnd() {
      if (done) return;
      done = true;
      numEl.removeEventListener('animationend', outEnd);
      putIn();
    }
    numEl.classList.add('fly-out');
    numEl.addEventListener('animationend', outEnd);
    setTimeout(outEnd, 470);
  }

  function show(n, dim) {
    numEl.textContent = n;
    numEl.classList.toggle('dim', !!dim);
    unitEl.classList.remove('off');
  }

  function randomN() {
    return ALL[Math.floor(Math.random() * ALL.length)];
  }

  var readingLock = false;

  function beginReading() {
    readingLock = true;
    pickBtn.dataset.mode = 'read';
    pickBtn.textContent = '正在朗读中';
    pickBtn.setAttribute('aria-disabled', 'true');
  }

  function endReading() {
    if (!readingLock) return;
    readingLock = false;
    pickBtn.setAttribute('aria-disabled', 'false');
    restIdle();
  }

  function restIdle() {
    state = 'idle';
    pickBtn.disabled = false;
    pickBtn.dataset.mode = 'start';
    pickBtn.textContent = '再来一次';
  }

  /* ---------- 念完收回号码，回到提示 ---------- */
  function afterReading() {
    if (readEnding || !showingNumber) return;
    readEnding = true;
    var token = areaToken;

    function toTips() {
      if (token !== areaToken) return;
      backToTips(true);
    }

    if (reduceMotion()) { toTips(); return; }
    numEl.classList.remove('rise-in');
    numEl.classList.add('fly-out');
    setTimeout(toTips, 430);
  }

  /* ---------- 点学号：立刻落定并念 ---------- */
  function pickManual(n) {
    if (state === 'settling') return;
    clearTimeout(rollTimer);
    muteRec();
    lastReadNumber = n;
    dedupeUntil = Date.now() + 2200;
    noteNamed(n);
    enterNumberMode();
    animToken++;
    showingNumber = false;
    highlight(n);
    clearHighlight();
    restIdle();
    beginReading();
    swapNumber(n, function () { speakNumber(n, afterReading); });
  }

  /* ---------- 随机滚动 ---------- */
  function startRoll() {
    state = 'rolling';
    muteRec();
    enterNumberMode();
    showingNumber = true;
    numEl.classList.remove('fly-out', 'rise-in');
    pickBtn.dataset.mode = 'stop';
    pickBtn.textContent = '停止';
    highlight(null);
    unitEl.classList.add('off');

    var tick = function () {
      show(randomN(), true);
      rollTimer = setTimeout(tick, 55);
    };
    tick();
  }

  function settle() {
    clearTimeout(rollTimer);
    state = 'settling';
    pickBtn.disabled = true;
    pickBtn.textContent = '抽号中';

    var final = randomN();
    var delays = [65, 75, 88, 105, 125, 150, 185, 225];
    var step = 0;

    var next = function () {
      if (step < delays.length) {
        show(randomN(), true);
        rollTimer = setTimeout(next, delays[step++]);
        return;
      }
      show(final, false);
      showingNumber = true;
      numEl.classList.remove('rise-in');
      void numEl.offsetWidth;
      numEl.classList.add('rise-in');
      setTimeout(function () { numEl.classList.remove('rise-in'); }, 900);
      highlight(final);
      noteNamed(final);
      lastReadNumber = final;
      dedupeUntil = Date.now() + 2200;
      restIdle();
      beginReading();
      speakNumber(final, afterReading);
    };
    next();
  }

  /* ---------- 隔空点击（摄像头 + 截图识别手势） ---------- */
  var MP_BASE = 'https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/';
  var gestBtn = document.getElementById('gestBtn');
  var gestState = document.getElementById('gestState');
  var camBox = document.getElementById('camBox');
  var camVideo = document.getElementById('camVideo');
  var camState = document.getElementById('camState');
  var camSnap = document.getElementById('camSnap');
  var camSnapCtx = camSnap.getContext('2d');

  var G = { on: false, model: null, stream: null, busy: false, onceResult: null };

  function pd(a, b) {
    var dx = a.x - b.x, dy = a.y - b.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function fingerStraight(lm, mcp, pip, tip) {
    var d1 = pd(lm[mcp], lm[pip]);
    var d2 = pd(lm[pip], lm[tip]);
    var d3 = pd(lm[mcp], lm[tip]);
    return d3 > (d1 + d2) * 0.86;
  }

  function digitOf(lm) {
    var scale = pd(lm[0], lm[9]) || 0.01;
    var idx = fingerStraight(lm, 5, 6, 8);
    var mid = fingerStraight(lm, 9, 10, 12);
    var rng = fingerStraight(lm, 13, 14, 16);
    var pky = fingerStraight(lm, 17, 18, 20);
    var thb = fingerStraight(lm, 2, 3, 4) && pd(lm[4], lm[5]) > scale * 0.42;
    var pinch = pd(lm[4], lm[8]) < scale * 0.45;
    var cnt = (idx ? 1 : 0) + (mid ? 1 : 0) + (rng ? 1 : 0) + (pky ? 1 : 0);

    if (pinch && !mid && !rng && !pky) return 7;
    if (thb && pky && !idx && !mid && !rng) return 6;
    if (cnt === 4 && thb) return 5;
    if (thb && idx && cnt === 1) return 8;
    if (cnt === 0 && !thb) return 0;
    return cnt;
  }

  function combineDigits(digits, count) {
    if (!count) return null;
    if (count === 1) return ALL.indexOf(digits[0]) !== -1 ? digits[0] : null;
    if (digits[0] <= 0 || digits[0] > 9 || digits[1] > 9) return null;
    var cands = [digits[0] * 10 + digits[1], digits[1] * 10 + digits[0]];
    for (var i = 0; i < cands.length; i++) {
      if (ALL.indexOf(cands[i]) !== -1) return cands[i];
    }
    return null;
  }

  function ensureModel() {
    if (G.model || typeof Hands === 'undefined') return;
    try {
      var h = new Hands({ locateFile: function (f) { return MP_BASE + f; } });
      h.setOptions({
        maxNumHands: 2,
        modelComplexity: 1,
        minDetectionConfidence: 0.4,
        minTrackingConfidence: 0.4
      });
      h.onResults(function (res) {
        if (G.onceResult) {
          var f = G.onceResult;
          G.onceResult = null;
          f(res);
        }
      });
      G.model = h;
    } catch (e) {
      G.model = null;
    }
  }

  function sendPass(canvas) {
    return new Promise(function (resolve) {
      var settled = false;
      var done = function (res) {
        if (settled) return;
        settled = true;
        resolve(res || null);
      };
      G.onceResult = function (res) { done(res); };
      try {
        G.model.send({ image: canvas }).then(function () {}, function () { done(null); });
      } catch (e) { done(null); }
      setTimeout(function () { done(null); }, 2600);
    });
  }

  function clearSnap() {
    camSnapCtx.clearRect(0, 0, camSnap.width, camSnap.height);
    camBox.classList.remove('snap');
    G.busy = false;
    if (G.on) camState.textContent = '喊「截图」';
  }

  function drawSnap(base, best, digits, n) {
    var W = camSnap.width, H = camSnap.height;
    camSnapCtx.clearRect(0, 0, W, H);
    camSnapCtx.drawImage(base, 0, 0, W, H);

    if (best) {
      var c = best.crop;
      var bw = base.width, bh = base.height;
      best.res.multiHandLandmarks.forEach(function (lm, hi) {
        camSnapCtx.fillStyle = 'rgba(196,60,34,.95)';
        lm.forEach(function (pt) {
          var x = ((c.sx + pt.x * c.sw) / bw) * W;
          var y = ((c.sy + pt.y * c.sh) / bh) * H;
          camSnapCtx.beginPath();
          camSnapCtx.arc(x, y, 2.1, 0, Math.PI * 2);
          camSnapCtx.fill();
        });
        if (digits[hi] !== undefined) {
          var wx = ((c.sx + lm[0].x * c.sw) / bw) * W;
          var wy = ((c.sy + lm[0].y * c.sh) / bh) * H;
          camSnapCtx.fillStyle = '#fff';
          camSnapCtx.font = '600 20px "PingFang SC", sans-serif';
          camSnapCtx.textAlign = 'center';
          camSnapCtx.fillText(String(digits[hi]), wx, Math.min(H - 8, wy + 26));
        }
      });
    }
    camBox.classList.add('snap');
  }

  function doSnap() {
    if (!G.on || G.busy) return;
    if (!G.model) { camState.textContent = '模型未载'; return; }
    var v = camVideo;
    if (!v || v.readyState < 2) { camState.textContent = '等摄像头'; return; }
    G.busy = true;
    camState.textContent = '识别中';

    var cw = v.videoWidth || 1280, ch = v.videoHeight || 720;
    var base = document.createElement('canvas');
    base.width = cw;
    base.height = ch;
    base.getContext('2d').drawImage(v, 0, 0, cw, ch);

    var crops = [
      { sx: 0, sy: 0, sw: cw, sh: ch },
      { sx: cw * 0.19, sy: ch * 0.17, sw: cw * 0.62, sh: ch * 0.66 },
      { sx: cw * 0.32, sy: ch * 0.28, sw: cw * 0.36, sh: ch * 0.44 }
    ];

    var hits = [];
    var idx = 0;

    function step() {
      if (idx >= crops.length) { finish(); return; }
      var c = crops[idx++];
      var tmp = document.createElement('canvas');
      tmp.width = 640;
      tmp.height = 480;
      tmp.getContext('2d').drawImage(base, c.sx, c.sy, c.sw, c.sh, 0, 0, 640, 480);
      sendPass(tmp).then(function (res) {
        if (res && res.multiHandLandmarks && res.multiHandLandmarks.length) {
          hits.push({ res: res, crop: c });
        }
        step();
      });
    }

    function finish() {
      var best = null;
      hits.forEach(function (r) {
        var spans = r.res.multiHandLandmarks.map(function (lm) { return pd(lm[0], lm[9]); });
        var score = r.res.multiHandLandmarks.length * 10 + Math.max.apply(null, spans);
        if (!best || score > best.score) best = { res: r.res, crop: r.crop, score: score };
      });

      var digits = [], n = null;
      if (best) {
        var hands = best.res.multiHandLandmarks.slice(0, 2);
        hands.sort(function (x, y) { return pd(y[0], y[9]) - pd(x[0], x[9]); });
        digits = hands.map(function (lm) { return digitOf(lm); });
        n = combineDigits(digits, digits.length);
      }

      drawSnap(base, best, digits, n);

      if (!n) {
        camState.textContent = digits.length ? digits.join('·') + ' 无效' : '没找到手';
        setTimeout(clearSnap, 1600);
        return;
      }
      camState.textContent = (digits.length > 1 ? digits.join('·') + ' → ' : '') + n;
      pickManual(n);
      setTimeout(clearSnap, 3800);
    }

    step();
  }

  /* ---- 「截图」口令的麦克风 ---- */
  var snapRec = null, snapRunning = false, snapRetry = 0;

  function initSnapRec() {
    if (snapRec || !REC) return;
    snapRec = new REC();
    snapRec.lang = 'zh-CN';
    snapRec.continuous = true;
    snapRec.interimResults = false;
    snapRec.maxAlternatives = 3;
    snapRec.onresult = function (e) {
      var txt = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) txt = e.results[i][0].transcript;
      }
      if (!txt) return;
      if (txt.indexOf('截图') >= 0 || txt.indexOf('截屏') >= 0 || txt.indexOf('拍照') >= 0) doSnap();
    };
    snapRec.onerror = function (e) {
      if (e && (e.error === 'not-allowed' || e.error === 'service-not-allowed')) {
        if (G.on) camState.textContent = '话筒未授权 · 点小窗';
      }
    };
    snapRec.onend = function () {
      snapRunning = false;
      if (G.on && !voiceMode) {
        clearTimeout(snapRetry);
        snapRetry = setTimeout(startSnapListen, 400);
      }
    };
  }

  function startSnapListen() {
    if (!G.on || voiceMode) return;
    if (!REC) { camState.textContent = '点小窗看手势'; return; }
    initSnapRec();
    if (!snapRec || snapRunning) return;
    try { snapRec.start(); snapRunning = true; } catch (e) { snapRunning = false; }
  }

  function stopSnapListen() {
    clearTimeout(snapRetry);
    if (!snapRec) return;
    try { snapRec.abort(); } catch (e) {}
    snapRunning = false;
  }

  function stopGesture() {
    G.on = false;
    G.busy = false;
    stopSnapListen();
    if (G.stream) {
      G.stream.getTracks().forEach(function (t) { t.stop(); });
      G.stream = null;
    }
    if (camVideo) camVideo.srcObject = null;
    clearSnap();
    camBox.classList.remove('on');
    gestBtn.setAttribute('data-on', '0');
    gestBtn.setAttribute('aria-pressed', 'false');
    gestState.textContent = '关';
  }

  function startGesture() {
    if (typeof Hands === 'undefined') {
      gestState.textContent = '模型未载';
      return;
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      gestState.textContent = '不支持';
      return;
    }
    ensureModel();
    if (!G.model) { gestState.textContent = '模型失败'; return; }

    navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
      audio: false
    }).then(function (stream) {
      G.stream = stream;
      G.on = true;
      camVideo.srcObject = stream;
      var p = camVideo.play();
      if (p && p.catch) p.catch(function () {});
      camBox.classList.add('on');
      gestBtn.setAttribute('data-on', '1');
      gestBtn.setAttribute('aria-pressed', 'true');
      gestState.textContent = '听';
      camState.textContent = '喊「截图」';
      startSnapListen();
    }).catch(function () {
      gestState.textContent = '无权限';
      G.on = false;
    });
  }

  function toggleGesture() {
    if (G.on) stopGesture();
    else startGesture();
  }

  /* ---------- 今日点名排行 + 加减分 ---------- */
  var rankBtn = document.getElementById('rankBtn');
  var logoBtn = document.getElementById('logoBtn');
  var rankPanel = document.getElementById('rankPanel');
  var rankTree = document.getElementById('rankTree');
  var rankDate = document.getElementById('rankDate');
  var rankReset = document.getElementById('rankReset');
  var resetMask = document.getElementById('resetMask');

  var RANK_KEY = 'rollcall_rank_v1';
  var RK = { date: '', counts: {} };

  function todayStr() {
    var d = new Date();
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + '-' + (m < 10 ? '0' + m : m) + '-' + (day < 10 ? '0' + day : day);
  }

  function saveRank() {
    try {
      localStorage.setItem(RANK_KEY, JSON.stringify({ date: RK.date, counts: RK.counts }));
    } catch (e) {}
  }

  function loadRank() {
    var t = todayStr();
    if (RK.date === t) return;
    RK.date = t;
    RK.counts = {};
    try {
      var raw = JSON.parse(localStorage.getItem(RANK_KEY) || 'null');
      if (raw && raw.date === t) {
        RK.counts = raw.counts || {};
      }
    } catch (e) {}
    saveRank();
  }

  /* 每念一次号就记一次，跨天自动清零重算 */
  function noteNamed(n) {
    loadRank();
    RK.counts[n] = (RK.counts[n] || 0) + 1;
    saveRank();
    if (!rankPanel.hidden) renderRank();
  }

  function renderRank() {
    loadRank();
    rankDate.textContent = RK.date;

    var order = ALL.slice().sort(function (a, b) {
      var d = (RK.counts[b] || 0) - (RK.counts[a] || 0);
      if (d) return d;
      return a - b;
    });

    var html = '';
    order.forEach(function (n, i) {
      var c = RK.counts[n] || 0;
      html += '<button class="rrow' + (c ? '' : ' zero') + '" type="button" data-n="' + n + '">'
        + '<span class="lrank">' + (i + 1) + '</span>'
        + '<span class="ln">' + n + '</span>'
        + '<span class="lc">' + (c ? c + ' 次' : '未点') + '</span>'
        + '</button>';
    });
    rankTree.innerHTML = html;
  }


  /* ---------- 二级页：一级按钮原地变形（含弹性与运动模糊） ---------- */
  var easeSettle = 'cubic-bezier(.22,.7,.28,1)';

  var floatClose = document.getElementById('floatClose');
  var floatOwner = null;

  function showFloat(btn, owner) {
    if (!floatClose || !btn) return;
    var r = btn.getBoundingClientRect();
    floatClose.style.left = r.left + 'px';
    floatClose.style.top = r.top + 'px';
    floatClose.style.width = r.width + 'px';
    floatClose.style.height = r.height + 'px';
    floatClose.hidden = false;
    floatOwner = owner;
    if (floatClose.animate && !reduceMotion()) {
      floatClose.animate([
        { opacity: 0, transform: 'scale(.62)' },
        { opacity: 1, transform: 'scale(1.04)', offset: .7 },
        { opacity: 1, transform: 'none' }
      ], { duration: 260, delay: 40, easing: 'cubic-bezier(.2,.85,.3,1)', fill: 'backwards' });
    }
  }

  function hideFloat(owner) {
    if (!floatClose) return;
    if (owner && floatOwner && owner !== floatOwner) return;
    floatClose.hidden = true;
    if (floatClose.getAnimations) floatClose.getAnimations().forEach(function (a) { a.cancel(); });
    floatOwner = null;
  }

  function hideOrigin(btn) {
    if (!btn) return;
    btn.style.opacity = '0';
    btn.style.pointerEvents = 'none';
  }

  function showOrigin(btn) {
    if (!btn) return;
    btn.style.opacity = '';
    btn.style.pointerEvents = '';
  }

  function placePanel(panel, btn, maxW) {
    var vw = document.documentElement.clientWidth;
    var vh = document.documentElement.clientHeight;
    var m = 16;

    panel.style.position = 'fixed';
    panel.style.right = 'auto';
    panel.style.bottom = 'auto';
    panel.style.width = Math.min(maxW, vw - m * 2) + 'px';
    panel.style.maxHeight = (vh - m * 2) + 'px';
    panel.style.left = '0px';
    panel.style.top = '0px';

    var w = panel.offsetWidth;
    var h = panel.offsetHeight;
    var b = btn.getBoundingClientRect();

    var left = (b.left + b.width / 2 > vw / 2) ? (b.right - w) : b.left;
    var top = (b.top + b.height / 2 > vh / 2) ? (b.bottom - h) : (b.bottom + 10);

    left = Math.min(Math.max(m, left), vw - m - w);
    top = Math.min(Math.max(m, top), vh - m - h);

    panel.style.left = left + 'px';
    panel.style.top = top + 'px';

    return { left: left, top: top, w: w, h: h, b: b };
  }

  function morphOpen(panel, btn, maxW, dur, mask) {
    if (!panel || !btn) return;
    if (mask) mask.hidden = false;
    if (panel.getAnimations) panel.getAnimations().forEach(function (a) { a.cancel(); });
    panel.hidden = false;

    var g = placePanel(panel, btn, maxW);
    if (!panel.animate || reduceMotion()) return;

    var sx = g.b.width / g.w;
    var sy = g.b.height / g.h;
    var tx = g.b.left - g.left;
    var ty = g.b.top - g.top;

    panel.style.transformOrigin = '0 0';
    panel.style.willChange = 'transform,filter,opacity';

    var anim = panel.animate([
      {
        transform: 'translate(' + tx + 'px,' + ty + 'px) scale(' + sx + ',' + sy + ')',
        borderRadius: '14px',
        filter: 'blur(2px)',
        opacity: 1,
        offset: 0
      },
      { filter: 'blur(10px)', offset: .2 },
      {
        transform: 'translate(' + (tx * .06) + 'px,' + (ty * .06) + 'px) scale(1.024,1.024)',
        filter: 'blur(3px)',
        offset: .56
      },
      { transform: 'scale(.996,.996)', filter: 'blur(0px)', offset: .76 },
      { transform: 'scale(1.005,1.005)', filter: 'blur(0px)', offset: .89 },
      { transform: 'none', filter: 'blur(0px)', offset: 1 }
    ], { duration: dur || 640, easing: 'cubic-bezier(.24,.7,.26,1)', fill: 'none' });

    anim.onfinish = function () { panel.style.willChange = ''; };
  }

  function morphClose(panel, btn, dur, done, mask) {
    if (!panel || !btn) { done(); return; }
    if (panel.getAnimations) panel.getAnimations().forEach(function (a) { a.cancel(); });

    var r = panel.getBoundingClientRect();
    var b = btn.getBoundingClientRect();
    var sx = Math.max(.04, b.width / Math.max(1, r.width));
    var sy = Math.max(.04, b.height / Math.max(1, r.height));
    var tx = b.left - r.left;
    var ty = b.top - r.top;

    if (!panel.animate || reduceMotion()) {
      if (mask) mask.hidden = true;
      done();
      return;
    }

    panel.style.transformOrigin = '0 0';
    panel.style.willChange = 'transform,filter,opacity';

    var anim = panel.animate([
      { transform: 'none', filter: 'blur(0px)', opacity: 1, offset: 0 },
      { filter: 'blur(6px)', offset: .22 },
      {
        transform: 'translate(' + (tx * .45) + 'px,' + (ty * .45) + 'px) scale(' + ((1 + sx) / 2) + ',' + ((1 + sy) / 2) + ')',
        filter: 'blur(8px)',
        opacity: 1,
        offset: .62
      },
      {
        transform: 'translate(' + tx + 'px,' + ty + 'px) scale(' + sx + ',' + sy + ')',
        filter: 'blur(2px)',
        opacity: 1,
        offset: 1
      }
    ], { duration: dur || 340, easing: 'cubic-bezier(.36,.02,.64,.28)', fill: 'forwards' });

    anim.onfinish = function () {
      anim.cancel();
      panel.style.willChange = '';
      if (mask) mask.hidden = true;
      done();
    };
  }

  function openReset() {
    resetMask.classList.remove('is-closing');
    hideOrigin(rankReset);
    hideFloat('rank');
    morphOpen(resetMask.querySelector('.sheet'), rankReset, 360, 620, resetMask);
    var ok = document.getElementById('resetOk');
    if (ok) setTimeout(function () { ok.focus(); }, 140);
  }

  function closeReset() {
    if (resetMask.hidden || resetMask.classList.contains('is-closing')) return;
    resetMask.classList.add('is-closing');
    morphClose(resetMask.querySelector('.sheet'), rankReset, 340, function () {
      resetMask.hidden = true;
      resetMask.classList.remove('is-closing');
      showOrigin(rankReset);
      if (!rankPanel.hidden) showFloat(rankBtn, 'rank');
    }, resetMask);
  }

  function resetToday() {
    RK.counts = {};
    saveRank();
    renderRank();
    closeReset();
  }

  function openRank() {
    loadRank();
    renderRank();
    rankBtn.setAttribute('aria-expanded', 'true');
    hideOrigin(rankBtn);
    morphOpen(rankPanel, rankBtn, 320, 640);
    showFloat(rankBtn, 'rank');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function closeRank() {
    if (rankPanel.hidden) return;
    rankBtn.setAttribute('aria-expanded', 'false');
    hideFloat('rank');
    morphClose(rankPanel, rankBtn, 340, function () {
      rankPanel.hidden = true;
      showOrigin(rankBtn);
    });
  }

  function toggleRank() {
    if (rankPanel.hidden) openRank();
    else closeRank();
  }


  /* ---------- 设置 ---------- */
  var SET_KEY = 'rollcall_set_v1';
  var SET = { count: 51, sound: true, voice: true, gest: true, grid: true, rank: true, radius: true, theme: '#C43C22' };
  var setMask = document.getElementById('setMask');
  var countNum = document.getElementById('countNum');

  function loadSet() {
    try {
      var raw = JSON.parse(localStorage.getItem(SET_KEY) || 'null');
      if (raw && typeof raw === 'object') {
        ['sound', 'voice', 'gest', 'grid', 'rank', 'radius'].forEach(function (k) {
          if (typeof raw[k] === 'boolean') SET[k] = raw[k];
        });
        var c = parseInt(raw.count, 10);
        if (!isNaN(c)) SET.count = Math.min(60, Math.max(1, c));
        if (typeof raw.theme === 'string' && /^#[0-9a-fA-F]{6}$/.test(raw.theme)) SET.theme = raw.theme.toLowerCase();
      }
    } catch (err) {}
  }

  function saveSet() {
    try { localStorage.setItem(SET_KEY, JSON.stringify(SET)); } catch (err) {}
  }

  function rebuildPool() {
    ALL.length = 0;
    for (var i = 1; i <= SET.count; i++) {
      if (EXCLUDE.indexOf(i) === -1) ALL.push(i);
    }
  }

  function refreshSwitches() {
    var map = {
      swSound: 'sound', swVoice: 'voice', swGest: 'gest',
      swGrid: 'grid', swRank: 'rank', swRadius: 'radius'
    };
    Object.keys(map).forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      var on = !!SET[map[id]];
      el.setAttribute('data-on', on ? '1' : '0');
      el.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    var inp = document.getElementById('setCount');
    if (inp) inp.value = SET.count;

    var themeInput = document.getElementById('setTheme');
    if (themeInput) themeInput.value = SET.theme;
    Array.prototype.forEach.call(document.querySelectorAll('.dot[data-color]'), function (d) {
      var on = d.getAttribute('data-color').toLowerCase() === SET.theme;
      d.classList.toggle('active', on);
    });
  }

  function applySettings() {
    rebuildPool();
    lastPicked = null;
    buildGrid();
    if (countNum) countNum.textContent = ALL.length;

    sndBtn.style.display = SET.sound ? '' : 'none';
    voiceBtn.style.display = SET.voice ? '' : 'none';
    gestBtn.style.display = SET.gest ? '' : 'none';
    rankBtn.style.display = SET.rank ? '' : 'none';

    if (!SET.voice && voiceMode) setVoiceMode(false);
    if (!SET.gest && typeof G !== 'undefined' && G.on) toggleGesture();
    if (!SET.rank && !rankPanel.hidden) closeRank();

    var allSec = document.querySelector('.all');
    if (allSec) allSec.style.display = SET.grid ? '' : 'none';

    document.documentElement.style.setProperty('--theme', SET.theme);
    document.documentElement.style.setProperty('--r', SET.radius ? '14px' : '0px');
    document.documentElement.style.setProperty('--r-sm', SET.radius ? '9px' : '0px');

    refreshSwitches();
    renderRank();
  }

  function setCountTo(v) {
    var c = parseInt(v, 10);
    if (isNaN(c)) c = SET.count;
    c = Math.min(60, Math.max(1, c));
    if (c === SET.count) { refreshSwitches(); return; }
    SET.count = c;
    saveSet();
    applySettings();
  }

  function lockScroll(on) {
    document.body.style.overflow = on ? 'hidden' : '';
  }

  function openSettings() {
    setMask.hidden = false;
    lockScroll(true);
    refreshSwitches();
    var dlg = setMask.querySelector('.dlg');
    if (dlg && dlg.animate && !reduceMotion()) {
      dlg.animate([
        { opacity: 0, transform: 'scale(.94) translateY(10px)', filter: 'blur(8px)' },
        { opacity: 1, transform: 'scale(1.006)', filter: 'blur(0px)', offset: .72 },
        { opacity: 1, transform: 'none' }
      ], { duration: 420, easing: 'cubic-bezier(.22,.8,.28,1)' });
    }
  }

  function closeSettings() {
    if (setMask.hidden) return;
    var dlg = setMask.querySelector('.dlg');
    if (dlg && dlg.animate && !reduceMotion()) {
      var anim = dlg.animate([
        { opacity: 1, transform: 'none' },
        { opacity: 0, transform: 'scale(.96) translateY(8px)', filter: 'blur(6px)' }
      ], { duration: 240, easing: 'cubic-bezier(.4,.05,.7,.3)', fill: 'forwards' });
      anim.onfinish = function () { anim.cancel(); setMask.hidden = true; lockScroll(false); };
    } else {
      setMask.hidden = true;
      lockScroll(false);
    }
  }

  /* ---------- 关于 ---------- */
  var closingTimer = null;

  function openAbout() {
    clearTimeout(closingTimer);
    aboutMask.classList.remove('is-closing');
    hideOrigin(logoBtn);
    morphOpen(aboutMask.querySelector('.sheet'), logoBtn, 420, 640, aboutMask);
    showFloat(logoBtn, 'about');
  }

  function closeAbout() {
    if (aboutMask.hidden || aboutMask.classList.contains('is-closing')) return;
    aboutMask.classList.add('is-closing');
    clearTimeout(closingTimer);
    hideFloat('about');
    morphClose(aboutMask.querySelector('.sheet'), logoBtn, 340, function () {
      aboutMask.hidden = true;
      aboutMask.classList.remove('is-closing');
      showOrigin(logoBtn);
    }, aboutMask);
  }

  /* ---------- 全局事件委托 ---------- */
  loadSet();
  applySettings();

  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t || !t.closest) return;

    if (!rankPanel.hidden && resetMask.hidden && !t.closest('#rankPanel') && !t.closest('#rankBtn')) closeRank();

    var row = t.closest('.rrow');
    if (row) {
      var rn = parseInt(row.getAttribute('data-n'), 10);
      if (!isNaN(rn)) { closeRank(); pickManual(rn); }
      return;
    }

    var cell = t.closest('.cell');
    if (cell) {
      var n = parseInt(cell.getAttribute('data-n'), 10);
      if (!isNaN(n)) pickManual(n);
      return;
    }

    if (t.closest('.logo')) { openAbout(); return; }

    if (t.closest('#setBtn')) { openSettings(); return; }
    var dot = t.closest('.dot[data-color]');
    if (dot) {
      SET.theme = dot.getAttribute('data-color').toLowerCase();
      saveSet();
      applySettings();
      return;
    }
    if (t.closest('#setClose')) { closeSettings(); return; }
    if (t.closest('#setMinus')) { setCountTo(SET.count - 1); return; }
    if (t.closest('#setPlus')) { setCountTo(SET.count + 1); return; }
    if (t.closest('.sw')) {
      var sw = t.closest('.sw');
      var keyMap = {
        swSound: 'sound', swVoice: 'voice', swGest: 'gest',
        swGrid: 'grid', swRank: 'rank', swRadius: 'radius'
      };
      var k = keyMap[sw.id];
      if (k) { SET[k] = !SET[k]; saveSet(); applySettings(); }
      return;
    }

    if (t.closest('#voiceBtn')) { setVoiceMode(!voiceMode); return; }
    if (t.closest('#gestBtn')) { toggleGesture(); return; }
    if (t.closest('#camBox')) { doSnap(); return; }

    var snd = t.closest('.snd');
    if (snd) {
      soundOn = !soundOn;
      snd.setAttribute('data-on', soundOn ? '1' : '0');
      snd.setAttribute('aria-pressed', soundOn ? 'true' : 'false');
      sndState.textContent = soundOn ? '开' : '关';
      if (!soundOn) {
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        readToken++;
        if (showingNumber) afterReading();
      }
      return;
    }

    if (t.closest('#rankBtn')) { toggleRank(); return; }
    if (t.closest('#floatClose')) {
      if (!resetMask.hidden) closeReset();
      else if (!aboutMask.hidden) closeAbout();
      else if (!rankPanel.hidden) closeRank();
      return;
    }
    if (t.closest('#rankReset')) { openReset(); return; }
    if (t.closest('#resetClose')) { closeReset(); return; }
    if (t.closest('#resetOk')) { resetToday(); return; }

    if (t.closest('.btn')) {
      if (readingLock) return;
      if (state === 'rolling') settle();
      else if (state !== 'settling') startRoll();
      return;
    }

    if (t.closest('#dlgClose')) closeAbout();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (!setMask.hidden) { closeSettings(); return; }
      if (!resetMask.hidden) { closeReset(); return; }
      if (!aboutMask.hidden) { closeAbout(); return; }
      if (!rankPanel.hidden) { closeRank(); return; }
    }
    if (e.code !== 'Space' && e.key !== ' ') return;
    var t = e.target;
    if (t && (t.tagName === 'BUTTON' || t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
    if (!aboutMask.hidden || !resetMask.hidden || !setMask.hidden) return;
    if (readingLock) return;
    e.preventDefault();
    if (state === 'rolling') settle();
    else if (state !== 'settling') startRoll();
  });

  aboutMask.addEventListener('mousedown', function (e) {
    if (e.target === aboutMask) closeAbout();
  });

  var themeInput = document.getElementById('setTheme');
  if (themeInput) {
    themeInput.addEventListener('input', function () {
      SET.theme = this.value.toLowerCase();
      document.documentElement.style.setProperty('--theme', SET.theme);
      Array.prototype.forEach.call(document.querySelectorAll('.dot[data-color]'), function (d) {
        d.classList.toggle('active', false);
      });
      saveSet();
    });
  }

  var setCountInput = document.getElementById('setCount');
  if (setCountInput) {
    setCountInput.addEventListener('change', function () { setCountTo(this.value); });
    setCountInput.addEventListener('blur', function () { setCountTo(this.value); });
  }

  window.addEventListener('resize', function () {
    if (!floatClose.hidden && floatOwner === 'rank') showFloat(rankBtn, 'rank');
    if (!floatClose.hidden && floatOwner === 'about') showFloat(logoBtn, 'about');
  });

  setMask.addEventListener('mousedown', function (e) {
    if (e.target === setMask) closeSettings();
  });

  resetMask.addEventListener('mousedown', function (e) {
    if (e.target === resetMask) closeReset();
  });


  /* ---------- 初始状态：中间先显示提示 ---------- */
  setTip(0, false);
  startTipLoop();
</script>
